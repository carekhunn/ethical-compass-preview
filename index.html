@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=DM+Sans:wght@400;600;700&display=swap');
:root{--bg:#0c1523;--panel:#17263a;--panel2:#1d3046;--ink:#edf2f7;--muted:#a9b8c8;--gold:#e7c58c;--line:#395067;--red:#ef8984;--green:#88d1b1;--yellow:#f1c778}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 90% 0,#203750 0,transparent 45%),var(--bg);color:var(--ink);font-family:'IBM Plex Sans Thai','DM Sans',system-ui,sans-serif;line-height:1.65}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}.shell{max-width:1100px;margin:auto;padding:20px 22px 75px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:8px 0 18px}.brand{display:flex;align-items:center;gap:12px;font-family:'DM Sans',sans-serif;font-weight:700;letter-spacing:2px}.logo{border:1px solid var(--gold);color:var(--gold);width:43px;height:43px;border-radius:50%;display:grid;place-items:center;font-size:27px}.tiny{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);font-family:'DM Sans',sans-serif}.muted{color:var(--muted)}h1{font-family:'DM Sans','IBM Plex Sans Thai',sans-serif;letter-spacing:-1px;line-height:1.12;font-size:clamp(35px,5vw,65px);margin:10px 0 16px}h2{font-size:clamp(23px,3vw,33px);line-height:1.35;margin:6px 0 15px}h3{margin:0 0 10px;font-size:20px}p{margin:8px 0 14px}.hero{padding:54px 0 25px;max-width:850px}.gold{color:var(--gold)}.cases{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.case{border:1px solid var(--line);border-radius:15px;background:linear-gradient(145deg,#22354b,#132235);padding:22px;text-align:left;color:var(--ink);min-height:226px;display:flex;flex-direction:column;transition:.2s}.case:hover,.case:focus-visible{transform:translateY(-3px);border-color:var(--gold);box-shadow:0 14px 35px #0005}.case .symbol{font-size:35px;color:var(--gold);line-height:1.2;margin:16px 0}.case strong{font-family:'DM Sans',sans-serif;letter-spacing:.5px;font-size:19px}.case small{color:var(--muted);line-height:1.6}.custom{background:linear-gradient(140deg,#3d382e,#1c2938);border-color:#857252}.panel{background:linear-gradient(145deg,var(--panel),#142237);border:1px solid var(--line);border-radius:17px;padding:clamp(20px,3vw,34px);margin:18px 0}.paper{background:#f1e8d8;color:#2e3540;padding:clamp(20px,4vw,38px);border-radius:5px 16px 16px 5px;box-shadow:inset 8px 0 #d1c3aa,0 14px 40px #0006;position:relative}.paper:before{content:'CONFIDENTIAL';font:700 12px 'DM Sans';letter-spacing:3px;color:#ad564e;border:2px solid #ad564e;padding:5px 9px;position:absolute;right:18px;top:17px;transform:rotate(8deg)}.paper p{margin-top:30px}.folder{border:2px solid #c5a76e;background:linear-gradient(160deg,#7b6040,#493b2d);border-radius:13px;padding:30px;text-align:center;max-width:530px;margin:24px auto;box-shadow:0 22px 40px #0007;position:relative}.folder:before{content:'';position:absolute;top:-14px;left:18px;width:120px;height:16px;border-radius:8px 8px 0 0;background:#7b6040}.folder .symbol{font-size:60px;color:#f4d9a5}.reveal{animation:unfold .65s ease both;transform-origin:top center}@keyframes unfold{from{opacity:0;transform:rotateX(-45deg) translateY(-15px)}to{opacity:1;transform:rotateX(0) translateY(0)}}.btn{border:1px solid var(--gold);border-radius:9px;background:var(--gold);color:#172335;padding:12px 20px;font-weight:700}.btn.secondary{background:transparent;color:var(--gold)}.btn.ghost{background:#22364b;color:var(--ink);border-color:var(--line)}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}.steps{display:flex;flex-wrap:wrap;gap:8px;margin:25px 0}.step{border:1px solid var(--line);padding:7px 11px;border-radius:25px;color:var(--muted);font-size:12px}.step.active{border-color:var(--gold);color:var(--gold);background:#e7c58c15}.step.done{color:var(--green)}.choicegrid{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin:20px 0}.choice{background:#1b2d43;border:1px solid var(--line);color:var(--ink);padding:18px;text-align:left;border-radius:12px;min-height:85px}.choice.selected{border-color:var(--gold);background:#6d593a55}.choice strong{display:block;font-size:17px}.choice span{font-size:12px;color:var(--muted)}label{display:block;font-weight:600;margin:13px 0 7px}textarea,input,select{background:#0e1c2c;border:1px solid #4b6175;border-radius:8px;color:var(--ink);padding:12px;width:100%;outline:none}textarea:focus,input:focus,select:focus{border-color:var(--gold)}textarea{min-height:86px;resize:vertical}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.pill{display:inline-block;font-size:12px;border:1px solid var(--line);padding:4px 10px;border-radius:30px;color:var(--gold)}.stakegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.stake{border:1px solid var(--line);background:#1d3046;border-radius:12px;padding:17px;color:var(--ink);text-align:left}.stake.active{border-color:var(--gold)}.stake.complete{border-color:var(--green)}.scale{display:flex;gap:8px;margin:9px 0 22px}.scale button{flex:1;min-height:47px;border:1px solid #52677b;border-radius:8px;background:#1b2d43;color:var(--ink)}.scale button.on.good{background:#255d4c;border-color:var(--green)}.scale button.on.bad{background:#653d42;border-color:var(--red)}.section{border-left:3px solid var(--gold);padding-left:15px;margin:20px 0}.line{border-top:1px solid var(--line);margin:22px 0}.impact-balance{border:1px solid var(--line);border-radius:15px;padding:20px;margin:16px 0 22px;background:#102033}.balance-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.balance-label{font-size:12px;color:var(--gold);letter-spacing:1px}.balance-tag{border-radius:18px;padding:4px 11px;font-size:12px;font-weight:700;background:#284e40;color:#a4ebc8}.balance-tag.negative{background:#60343b;color:#ffb6b2}.balance-tag.neutral{background:#62502e;color:#f5d98e}.balance-count{font-size:22px;font-weight:700;margin:14px 0}.balance-numbers{display:flex;justify-content:space-between;font-size:14px;font-weight:700}.balance-bar{display:flex;width:100%;height:14px;border-radius:20px;overflow:hidden;background:#34485a;margin:8px 0 14px}.balance-good{background:#149d83}.balance-bad{background:#dc6d70}.balance-note{font-size:13px;color:var(--muted)}.balance-alert{display:flex;gap:9px;margin-top:13px;padding:12px;border:1px solid #a8804b;border-radius:9px;color:#f1d2a1;font-size:13px}.balance-alert strong{color:#ffe4b7}.balance-foot{font-size:12px;color:var(--muted);margin-top:12px}.result{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.signal{border:1px solid var(--line);border-radius:12px;padding:16px;background:#1d3046}.signal .dot{width:12px;height:12px;border-radius:50%;display:inline-block;margin-right:8px}.green{color:var(--green)}.yellow{color:var(--yellow)}.red{color:var(--red)}.dot.green{background:var(--green)}.dot.yellow{background:var(--yellow)}.dot.red{background:var(--red)}.note{background:#26394c;border-left:3px solid var(--gold);padding:15px;border-radius:4px;margin:18px 0}.warn{color:#f0caa1;font-size:13px}.progress{height:6px;background:#2b4054;border-radius:9px;overflow:hidden;margin:10px 0 22px}.progress>div{height:100%;background:var(--gold);transition:width .3s}.tag{display:inline-block;padding:3px 9px;background:#ffffff0d;border:1px solid var(--line);border-radius:6px;font-size:12px;margin:4px 5px 4px 0}.footer{margin-top:50px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:15px}@media(max-width:750px){.cases{grid-template-columns:1fr 1fr}.result{grid-template-columns:1fr}.shell{padding:14px}.hero{padding-top:32px}}@media(max-width:520px){.cases,.choicegrid,.grid2,.stakegrid{grid-template-columns:1fr}.top .tiny{display:none}.case{min-height:175px}}
.scoreguide{background:#102136;border:1px solid #52677b;border-radius:12px;padding:16px;margin:16px 0}.scoreguide h4{margin:0 0 9px;color:var(--gold);font-size:16px}.scoreguide .levels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.scoreguide .level{background:#21364a;border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.5}.scoreguide .level b{color:var(--gold);font-size:17px;margin-right:5px}.scoreguide .hint{font-size:13px;color:var(--muted);margin:10px 0 0}.scale button{min-height:58px}.scale button .scorelabel{display:block;font-size:11px;font-weight:400;line-height:1.25}@media(max-width:530px){.scoreguide .levels{grid-template-columns:1fr 1fr}.scoreguide .level{padding:8px;font-size:12px}} .guidecols{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.guidecol{padding:12px;border-radius:12px;background:#1b3042;border:1px solid #3e5266}.guidecol h4{font-size:14px}.benefitguide h4{color:#8fe0b6}.harmguide h4{color:#ffb3b3}.guidecol .levels{grid-template-columns:1fr}.guidecol .level{background:#263e52}.benefitguide .level b{color:#8fe0b6}.harmguide .level b{color:#ffb3b3}@media(max-width:700px){.guidecols{grid-template-columns:1fr}}  .current-stake{position:sticky;top:0;z-index:5;padding:15px 18px;margin:0 0 14px;background:#233a4b;border:2px solid #c4a364;border-radius:14px;box-shadow:0 8px 25px #0007} .decision-card{max-width:750px;margin:0 auto;border-radius:26px!important;box-shadow:0 18px 60px #0008,inset 0 0 0 5px #ffffff0b;position:relative;overflow:hidden} .decision-card:before{content:'✦';position:absolute;right:22px;top:14px;font-size:68px;color:#d6b46b22;pointer-events:none} .decision-card .section{border-radius:12px;background:#ffffff08;padding:13px 16px;margin:12px 0} .intro-guide h2{margin:26px 0 10px;color:#e8d09a;font-size:21px}.intro-guide p{line-height:1.85}.intro-guide li{line-height:1.8;margin-bottom:8px}.intro-guide ol,.intro-guide ul{padding-left:25px}.lens-intro-overlay{position:fixed;inset:0;z-index:9999;background:#020812c9;display:flex;align-items:center;justify-content:center;padding:18px}.lens-intro-box{width:min(100%,510px);background:#1b2d42;color:#eef1f5;border:1px solid #c9a46e;border-radius:18px;padding:clamp(20px,4vw,32px);box-shadow:0 22px 80px #0009}.lens-intro-box h2{font-size:clamp(22px,4vw,29px);color:#f0d39b;line-height:1.45}.lens-intro-box p{line-height:1.8;color:#e8edf2}.lens-intro-box button{width:100%;margin-top:14px}</style></head><body><main class="shell"><header class="top"><div class="brand"><div class="logo">✧</div><div>ETHICAL<br>COMPASS</div></div><div class="tiny">THE CASE FILES · V5.7</div><button class="btn ghost" id="homeBtn">⌂ Case Library</button></header><div id="app"></div><footer class="footer">Ethical Compass เป็นเครื่องมือฝึกการพิจารณาทางจริยธรรม ไม่ใช่ระบบตัดสินความถูกผิดหรือคำแนะนำทางกฎหมาย · ข้อมูลอยู่ในเบราว์เซอร์ของผู้เล่นเท่านั้น ไม่มีการส่งข้อมูลขึ้นเซิร์ฟเวอร์</footer></main><script id="case-data" type="application/json">[{"id":"silent","num":"01","title":"THE SILENT APPROVAL","subtitle":"Power & Silence","icon":"◈","brief":"รายงานพฤติกรรมผู้จัดการที่มีอำนาจเหนือคุณ หรือรักษาความลับของผู้ให้ข้อมูล?","story":"คุณเพิ่งย้ายมาดูแลทีมได้ 2 เดือน พบว่าผู้จัดการซึ่งเป็นหัวหน้าของคุณตำหนิและกดดันพนักงานอย่างรุนแรงมานาน หลายคนไม่กล้าร้องเรียนเพราะกลัวถูกตอบโต้ HR ติดต่อคุณเพื่อสอบถามสาเหตุการลาออกสูง พนักงานในทีมชื่อ “เมย์” ซึ่งไว้ใจคุณ เล่าเรื่องพฤติกรรมของผู้จัดการและขอให้คุณอย่าเปิดเผยว่าเธอเป็นผู้ให้ข้อมูล เพราะกลัวถูกระบุตัว ขณะเดียวกันผู้จัดการบอกว่าการสอบสวนอาจทำให้โครงการสำคัญสะดุด และเขามีอิทธิพลต่อการประเมินผลงานของคุณ","action":"รายงานข้อกังวลต่อ HR ในตอนนี้","yes":"REPORT — รายงานตอนนี้","no":"DON’T REPORT — ยังไม่รายงาน","conf":"คุณทราบว่าพนักงานอีกคนหนึ่ง (ไม่ใช่เมย์) เคยแจ้ง HR แล้ว ต่อมาผู้จัดการรู้รายละเอียดบางอย่างและลดบทบาทเขาในโครงการ แม้ยังพิสูจน์ไม่ได้ว่าเป็นการตอบโต้ ขณะเดียวกัน HR แจ้งว่ามีช่องทางรับเรื่องที่จำกัดผู้เข้าถึงข้อมูล แต่ยังไม่อธิบายมาตรการป้องกันการระบุตัวผู้ให้ข้อมูล","stake":[["เมย์ (พนักงานผู้ให้ข้อมูล)","การรายงานอาจช่วยให้ข้อกังวลของเมย์ได้รับการตรวจสอบมากเพียงใด?","การรายงานอาจทำให้เมย์ถูกระบุตัวหรือถูกตอบโต้มากเพียงใด?"],["พนักงานคนอื่น","การรายงานอาจช่วยลดการกดดันและสร้างความปลอดภัยให้ทีมมากเพียงใด?","การตรวจสอบอาจสร้างความตึงเครียดหรือกระทบคนในทีมมากเพียงใด?"],["ตัวคุณ","การรายงานอาจช่วยให้คุณทำหน้าที่หัวหน้างานอย่างรับผิดชอบมากเพียงใด?","การรายงานอาจกระทบความสัมพันธ์กับผู้จัดการและอาชีพของคุณมากเพียงใด?"],["องค์กร","องค์กรอาจได้ประโยชน์จากการจัดการปัญหาและรักษาคนในทีมมากเพียงใด?","องค์กรอาจมีต้นทุนหรือความเสี่ยงจากการจัดการเรื่องนี้มากเพียงใด?"],["ฝ่าย HR","ฝ่าย HR อาจได้รับข้อมูลที่ช่วยดูแลพนักงานและปรับปรุงระบบมากเพียงใด?","ฝ่าย HR อาจต้องรับภาระการตรวจสอบและการคุ้มครองข้อมูลมากเพียงใด?"],["ผู้จัดการที่ถูกรายงาน","การรายงานอาจช่วยให้ผู้จัดการได้รับข้อเสนอแนะและมีโอกาสปรับปรุงพฤติกรรมอย่างเป็นธรรมมากเพียงใด?","การรายงานอาจกระทบชื่อเสียง ความสัมพันธ์ และหน้าที่การงานของผู้จัดการมากเพียงใด โดยเฉพาะหากข้อเท็จจริงยังไม่ชัดเจน?"]],"duties":["ถ้าคุณรายงานตอนนี้ คุณกำลังทำหน้าที่ดูแลพนักงานอยู่ไหม?","การรายงานตอนนี้อาจทำให้คุณผิดความไว้วางใจของผู้ให้ข้อมูลไหม?","คุณคิดว่ามีวิธีรายงานที่ช่วยปกป้องทีมและรักษาความลับของผู้ให้ข้อมูลไปพร้อมกันได้ไหม?"],"virtues":["คุณกล้าปกป้องทีม แม้ตัวเองอาจเดือดร้อนหรือเปล่า?","คุณคิดถึงความกลัวของคนที่มาเล่าเรื่องให้ฟังมากพอไหม?","คุณคิดว่าทางเลือกนี้แสดงทั้งความกล้าหาญและความระมัดระวังต่อคนที่เสี่ยงไหม?"],"role":"คุณคือหัวหน้าทีมที่เพิ่งรับตำแหน่ง และเป็นผู้ตัดสินใจว่าจะรายงานข้อกังวลต่อ HR หรือไม่"},{"id":"star","num":"02","title":"THE STAR PERFORMER","subtitle":"Performance & Fairness","icon":"✦","brief":"สนับสนุนรางวัลให้คนทำผลงานยอดเยี่ยมที่เคยทำร้ายความรู้สึกเพื่อนร่วมงานหรือไม่?","story":"คุณเป็นหัวหน้าทีมร่วมคณะเสนอชื่อรางวัลพนักงานยอดเยี่ยม “ต้น” ทำยอดขายสูงสุดและช่วยรักษาลูกค้ารายสำคัญ แต่เพื่อนร่วมงานหลายคนเล่าว่าเขาเคยดูถูกและกดดันคนอื่น บางคนไม่อยากทำงานร่วมกับเขา ผู้บริหารต้องการให้เสนอชื่อต้นเพื่อส่งสัญญาณว่าบริษัทให้คุณค่ากับผลงาน ขณะที่เกณฑ์รางวัลระบุทั้งผลลัพธ์และการทำงานร่วมกัน แต่ยังไม่มีการตรวจสอบข้อร้องเรียนอย่างเป็นทางการ","action":"สนับสนุนเสนอชื่อต้นรับรางวัลในรอบนี้","yes":"ENDORSE — สนับสนุน","no":"DON’T ENDORSE — ไม่สนับสนุน","conf":"HR เปิดเผยว่าต้นเคยได้รับคำเตือนเรื่องการสื่อสาร และมีหลักฐานว่าเข้าร่วมการโค้ชอย่างต่อเนื่องสองเดือนล่าสุด เพื่อนร่วมงานบางคนเห็นว่าเขาปรับตัวดีขึ้น แต่ผู้ที่เคยได้รับผลกระทบยังไม่เคยได้รับคำขอโทษ ขณะเดียวกันลูกค้าสำคัญส่งจดหมายชมเขาโดยเฉพาะ","stake":[["ต้น","การได้รับรางวัลอาจช่วยส่งเสริมการปรับปรุงตัวและผลงานของต้นมากเพียงใด?","การได้รับรางวัลอาจสร้างแรงกดดันหรือความคาดหวังที่ไม่เหมาะสมต่อต้นมากเพียงใด?"],["เพื่อนร่วมงานที่ได้รับผลกระทบ","การเสนอชื่ออาจช่วยให้พวกเขาได้ร่วมงานกับคนที่ปรับตัวดีขึ้นมากเพียงใด?","การเสนอชื่ออาจทำให้พวกเขารู้สึกว่าพฤติกรรมที่เคยเกิดขึ้นถูกมองข้ามมากเพียงใด?"],["สมาชิกทีมคนอื่น","การยกย่องผลงานอาจกระตุ้นทีมให้พัฒนามากเพียงใด?","การยกย่องอาจบั่นทอนความเชื่อมั่นในเกณฑ์รางวัลมากเพียงใด?"],["ลูกค้า","การตัดสินใจนี้อาจช่วยให้ลูกค้าได้รับบริการที่ดีและต่อเนื่องมากเพียงใด?","การตัดสินใจนี้อาจกระทบคุณภาพบริการหรือความเชื่อมั่นของลูกค้ามากเพียงใด?"],["องค์กร","การตัดสินใจนี้อาจช่วยรักษาผลงานและมาตรฐานองค์กรได้มากเพียงใด?","การตัดสินใจนี้อาจกระทบความน่าเชื่อถือของเกณฑ์รางวัลมากเพียงใด?"]],"duties":["คุณพิจารณาทั้งผลงานและวิธีปฏิบัติต่อเพื่อนร่วมงานแล้วหรือยัง?","ถ้าต้นได้รางวัล คนที่เคยได้รับผลกระทบจะได้รับความเป็นธรรมไหม?","คุณคิดว่าสามารถให้โอกาสต้นปรับตัว โดยไม่มองข้ามผลกระทบที่เคยเกิดขึ้นได้ไหม?"],"virtues":["คุณกำลังให้ความยุติธรรมกับทั้งต้นและคนที่เคยได้รับผลกระทบไหม?","คุณเปิดใจให้ต้นได้พิสูจน์ว่าตัวเองเปลี่ยนไปแล้วหรือเปล่า?","คุณกล้าพูดเรื่องพฤติกรรมของต้น แม้เขาจะทำผลงานได้ดีมากไหม?"],"role":"คุณคือหัวหน้าทีมซึ่งเป็นหนึ่งในคณะผู้เสนอชื่อรางวัล และต้องตัดสินใจว่าจะสนับสนุนการเสนอชื่อต้นหรือไม่"},{"id":"mistake","num":"03","title":"WHEN MANAGEMENT CROSSES THE LINE","subtitle":"เมื่อผู้บริหารใช้อำนาจเกินขอบเขต","icon":"⚖","brief":"เมื่อผู้จัดการทำให้พนักงานอึดอัดและกลัวถูกตอบโต้ คุณจะร้องเรียนหรือไม่?","story":"คุณทำงานเป็นพนักงานเสิร์ฟในร้านอาหารชื่อดังแห่งหนึ่ง ผู้จัดการร้านมีพฤติกรรมพูดจาแทะโลม แสดงความคิดเห็นที่ทำให้พนักงานหญิงรู้สึกอึดอัด และมักใช้มุกตลกที่ไม่เหมาะสม แม้จะไม่ได้สัมผัสร่างกายพนักงานก็ตาม ผู้จัดการคนนี้มีอำนาจในการจัดตารางงานและประเมินพนักงาน อีกทั้งยังมีพฤติกรรมข่มขู่หรือกลั่นแกล้งผู้ที่ไม่พอใจเขา ทำให้พนักงานหลายคนไม่กล้าร้องเรียน เพราะกลัวถูกตอบโต้หรือเสียงาน คุณทราบว่าพฤติกรรมดังกล่าวไม่เหมาะสม แต่ก็จำเป็นต้องทำงานที่นี่ต่อไป หากคุณเป็นพนักงานในสถานการณ์นี้ คุณจะตัดสินใจอย่างไร?","action":"ร้องเรียนพฤติกรรมของผู้จัดการผ่านช่องทางที่เหมาะสม","yes":"REPORT — ร้องเรียนพฤติกรรมผู้จัดการ","no":"DON’T REPORT — ยังไม่ร้องเรียน","conf":"ข้อมูลเพิ่มเติมสำหรับการวิเคราะห์: ก่อนตัดสินใจ ลองพิจารณาว่ามีช่องทางร้องเรียนที่ไม่อยู่ภายใต้อำนาจของผู้จัดการหรือไม่ จะรักษาความลับของผู้ให้ข้อมูลอย่างไร และจะขอความช่วยเหลือได้จากใครบ้าง ข้อมูลเหล่านี้ยังไม่ได้ระบุไว้ในสถานการณ์","stake":[["ตัวคุณ (พนักงานเสิร์ฟ)","",""],["พนักงานหญิงที่ได้รับผลกระทบ","",""],["พนักงานคนอื่นในร้าน","",""],["ผู้จัดการร้าน","",""],["เจ้าของร้านหรือฝ่ายบริหาร","",""],["ลูกค้าของร้าน","",""]],"duties":["ทางเลือกนี้คำนึงถึงสิทธิของพนักงานที่จะทำงานโดยไม่ถูกคุกคามหรือไม่?","ทางเลือกนี้คำนึงถึงความปลอดภัยและความเสี่ยงที่จะถูกตอบโต้หรือไม่?","คุณควรตรวจสอบช่องทางร้องเรียนและมาตรการคุ้มครองพนักงานก่อนลงมือหรือไม่?"],"virtues":["ทางเลือกนี้สะท้อนความกล้าหาญโดยไม่ละเลยความปลอดภัยของตนเองหรือไม่?","ทางเลือกนี้แสดงความเห็นใจต่อพนักงานที่ได้รับผลกระทบหรือไม่?","ทางเลือกนี้เป็นธรรมต่อทุกฝ่ายและยึดข้อเท็จจริงหรือไม่?"],"role":"คุณคือพนักงานเสิร์ฟในร้านอาหารแห่งนี้ ต้องตัดสินใจว่าจะรายงานพฤติกรรมของผู้จัดการผ่านช่องทางที่เหมาะสมหรือไม่"},{"id":"seat","num":"04","title":"A MORAL DILEMMA: HEAD VS. HEART","subtitle":"เมื่อสิ่งที่ถูกต้องตามกฎหมาย อาจไม่ใช่สิ่งที่ถูกต้องในความรู้สึก","icon":"♡","brief":"จะช่วยเหลือครอบครัวพนักงานที่เสียชีวิต หรือรักษางบขึ้นเงินเดือนของพนักงานคนอื่น?","story":"พนักงานชายวัย 42 ปีเสียชีวิตกะทันหัน ทิ้งภรรยาและลูกเล็กไว้เบื้องหลัง บริษัทพบว่าเขาไม่ได้รับการลงทะเบียนในโครงการประกันชีวิต เนื่องจากความผิดพลาดของฝ่ายธุรการเมื่อ 3 ปีก่อน ซึ่งไม่ใช่ความผิดของพนักงาน ฝ่ายกฎหมายยืนยันว่า บริษัทไม่มีภาระผูกพันต้องจ่ายเงินประกัน แต่หากบริษัทตัดสินใจช่วยเหลือครอบครัว จะต้องนำงบประมาณของบริษัทมาจ่ายเอง เป็นจำนวนเท่ากับเงินเดือนพนักงาน 2 ปี ในฐานะผู้จัดการ คุณมีหน้าที่ดูแลทรัพยากรขององค์กร และงบประมาณที่สามารถนำมาใช้จ่ายเงินก้อนนี้ได้ คือ งบที่จัดสรรไว้สำหรับขึ้นเงินเดือนตามผลงานให้พนักงานคนอื่น หากคุณเป็นผู้จัดการ คุณจะตัดสินใจอย่างไร?","action":"ใช้งบขึ้นเงินเดือนตามผลงานเพื่อช่วยเหลือครอบครัวผู้เสียชีวิต","yes":"HELP — ใช้งบช่วยเหลือครอบครัว","no":"DON’T USE BUDGET — ไม่ใช้งบก้อนนี้ช่วยเหลือ","conf":"ข้อมูลเพิ่มเติมสำหรับการวิเคราะห์: ลองตรวจสอบว่าบริษัทมีช่องทางช่วยเหลืออื่นหรือไม่ ใครมีอำนาจอนุมัติงบ และจะสื่อสารกับพนักงานที่อาจเสียโอกาสขึ้นเงินเดือนอย่างไร สถานการณ์ยังไม่ได้ระบุคำตอบของเรื่องเหล่านี้","stake":[["ภรรยาของผู้เสียชีวิต","",""],["ลูกเล็กของผู้เสียชีวิต","",""],["พนักงานที่รอขึ้นเงินเดือนตามผลงาน","",""],["ตัวคุณ (ผู้จัดการ)","",""],["ฝ่ายธุรการ","",""],["องค์กร","",""]],"duties":["ทางเลือกนี้รับผิดชอบต่อความผิดพลาดของระบบธุรการอย่างเหมาะสมหรือไม่?","ทางเลือกนี้เคารพความเป็นธรรมต่อพนักงานที่รอขึ้นเงินเดือนหรือไม่?","คุณควรตรวจสอบอำนาจอนุมัติและทางเลือกช่วยเหลืออื่นก่อนใช้เงินก้อนนี้หรือไม่?"],"virtues":["ทางเลือกนี้สะท้อนความเห็นอกเห็นใจต่อครอบครัวผู้เสียชีวิตหรือไม่?","ทางเลือกนี้ยุติธรรมต่อพนักงานคนอื่นที่อาจได้รับผลกระทบหรือไม่?","ทางเลือกนี้แสดงความรับผิดชอบและความรอบคอบในการดูแลงบประมาณหรือไม่?"],"role":"คุณคือผู้จัดการที่ต้องตัดสินใจว่าจะใช้งบขึ้นเงินเดือนตามผลงานของพนักงานคนอื่น เพื่อช่วยเหลือครอบครัวผู้เสียชีวิตหรือไม่"},{"id":"deadline","num":"05","title":"THE EXPENSE REPORT","subtitle":"Honesty vs. Peer Pressure","icon":"▣","brief":"พนักงานใหม่พบว่าผู้จัดการฝ่ายขายเบิกค่าใช้จ่ายเกินจริง จะทำตามหรือไม่?","story":"เจนเป็นพนักงานขายใหม่ที่กำลังฝึกงานกับแอน ผู้จัดการฝ่ายขายซึ่งเป็นรุ่นพี่ที่มีผลงานยอดเยี่ยมของบริษัท ระหว่างทำรายงานเบิกค่าใช้จ่าย เจนพบว่าแอนกรอกยอดค่าใช้จ่ายสูงกว่าที่จ่ายจริงประมาณ 25% โดยแอนอธิบายว่า บริษัทกำหนดวงเงินเบิกไว้เพียงวันละ 25 ดอลลาร์ ซึ่งไม่เพียงพอต่อค่าใช้จ่ายจริง และไม่จำเป็นต้องแนบใบเสร็จ แอนบอกว่า “พนักงานขายทุกคนก็ทำแบบนี้ หากทุกคนทำเหมือนกัน บริษัทก็จะไม่สงสัย” พร้อมย้ำว่าบริษัทมีกำไรสูงและสามารถจ่ายเงินส่วนนี้ได้ แม้เจนจะรู้สึกว่าการเบิกค่าใช้จ่ายเกินจริงเป็นสิ่งที่ไม่ถูกต้อง แต่เธอก็เป็นเพียงพนักงานใหม่ที่ต้องทำงานร่วมกับแอน หากคุณเป็นเจน คุณจะตัดสินใจอย่างไร?","action":"กรอกยอดเบิกค่าใช้จ่ายเกินจริงตามที่แอนแนะนำ","yes":"FOLLOW — เบิกเกินจริงตามแอน","no":"REFUSE — ไม่เบิกเกินจริง","conf":"ข้อมูลเพิ่มเติมสำหรับการวิเคราะห์: ก่อนตัดสินใจ ลองตรวจสอบนโยบายเบิกค่าใช้จ่ายและช่องทางขอทบทวนวงเงินของบริษัท รวมถึงช่องทางขอคำปรึกษาเมื่อมีแรงกดดันจากผู้จัดการฝ่ายขายที่เป็นรุ่นพี่ ข้อมูลเหล่านี้ยังไม่ได้ระบุไว้ในสถานการณ์","stake":[["เจน (ตัวคุณ)","",""],["แอน (ผู้จัดการฝ่ายขายและรุ่นพี่)","",""],["พนักงานขายคนอื่น","",""],["ฝ่ายการเงิน","",""],["บริษัท","",""]],"duties":["ทางเลือกนี้สอดคล้องกับหน้าที่ในการรายงานค่าใช้จ่ายตามจริงหรือไม่?","ทางเลือกนี้เป็นธรรมต่อบริษัทและพนักงานคนอื่นหรือไม่?","คุณควรตรวจสอบนโยบายและขอคำปรึกษาก่อนส่งรายงานหรือไม่?"],"virtues":["ทางเลือกนี้สะท้อนความซื่อสัตย์แม้มีแรงกดดันจากรุ่นพี่หรือไม่?","ทางเลือกนี้แสดงความกล้าหาญและความเคารพต่อผู้เกี่ยวข้องหรือไม่?","ทางเลือกนี้สะท้อนความรอบคอบและความรับผิดชอบหรือไม่?"],"role":"คุณคือเจน พนักงานขายใหม่ที่กำลังฝึกงานกับแอน ผู้จัดการฝ่ายขาย และต้องตัดสินใจว่าจะกรอกยอดเบิกค่าใช้จ่ายเกินจริงตามแอนหรือไม่"}]</script><script>

function lensIntroModal(){return state.lensIntroSeen?'':`<div class="lens-intro-overlay"><section class="lens-intro-box" role="dialog" aria-modal="true" aria-labelledby="lensIntroTitle"><h2 id="lensIntroTitle">ลองมองอีกมุม ก่อนตัดสินใจอีกครั้ง</h2><p>มาลองใช้แนวคิดทางจริยธรรมช่วยทบทวนการตัดสินใจของคุณ</p><p>เพียงเลือกอย่างน้อย 2 มุมมอง แล้วเกมจะพาคุณวิเคราะห์ทีละขั้นตอน</p><button class="btn" data-act="dismissLensIntro">เริ่มสำรวจมุมมอง →</button></section></div>`}
function render(){let c=state.case;if(state.page==='intro'){html(header('รู้จัก Ethical Compass','FROM INSTINCT TO INSIGHT','จากการตัดสินใจด้วยสัญชาตญาณ สู่การพิจารณาอย่างรอบด้าน')+`<section class="panel intro-guide"><h2>Ethical Compass คืออะไร?</h2><p>Ethical Compass เป็นเครื่องมือสนับสนุนการคิดและการตัดสินใจเชิงจริยธรรม ผ่านสถานการณ์จำลองที่ผู้ใช้งานต้องเผชิญกับทางเลือกซึ่งมีความขัดแย้งระหว่างคุณค่า ผลประโยชน์ และความรับผิดชอบต่อผู้มีส่วนเกี่ยวข้อง</p><p>เครื่องมือนี้ไม่ได้มีหน้าที่ตัดสินว่าทางเลือกใดถูกหรือผิด แต่ถูกออกแบบมาเพื่อช่วยให้ผู้ใช้งานได้ทบทวนเหตุผลของตนเอง และพิจารณาสถานการณ์จากมุมมองที่หลากหลายก่อนตัดสินใจ</p><h2>วัตถุประสงค์ของการพัฒนา</h2><ol><li>เพื่อส่งเสริมกระบวนการคิดและการตัดสินใจเชิงจริยธรรมอย่างเป็นระบบ</li><li>เพื่อเปิดโอกาสให้ผู้ใช้งานได้ทบทวนการตัดสินใจเมื่อได้รับข้อมูลหรือมุมมองเพิ่มเติม</li><li>เพื่อสนับสนุนการประยุกต์ใช้ทฤษฎีจริยธรรม 3 แนวคิด ได้แก่ Utilitarianism, Deontology และ Virtue Ethics ในการวิเคราะห์สถานการณ์</li><li>เพื่อสะท้อนให้เห็นพัฒนาการของเหตุผลและมุมมองในการตัดสินใจ ตั้งแต่ก่อนจนถึงหลังการใช้เครื่องมือ</li></ol><h2>Ethical Compass ทำงานอย่างไร?</h2><p>ผู้ใช้งานจะเริ่มจากการอ่านสถานการณ์และตัดสินใจตามมุมมองของตนเอง จากนั้นจะได้รับข้อมูลเพิ่มเติมที่อาจทำให้ต้องทบทวนการตัดสินใจ ก่อนนำทฤษฎีจริยธรรมทั้ง 3 แนวคิดมาใช้พิจารณาสถานการณ์ ได้แก่</p><ul><li><strong>Utilitarianism:</strong> พิจารณาประโยชน์และผลกระทบที่อาจเกิดขึ้นต่อผู้เกี่ยวข้อง</li><li><strong>Deontology:</strong> พิจารณาหน้าที่ หลักการ สิทธิ และความรับผิดชอบ</li><li><strong>Virtue Ethics:</strong> พิจารณาคุณธรรมและลักษณะของการกระทำที่สะท้อนความเป็นคนดี</li></ul><p>เมื่อสิ้นสุดกระบวนการ ผู้ใช้งานจะได้ทบทวนการตัดสินใจอีกครั้ง และเปรียบเทียบเหตุผลของตนเองก่อนและหลังการใช้เครื่องมือ</p><h2>ประโยชน์ที่คาดว่าจะได้รับ</h2><ul><li>ช่วยกระตุ้นให้ผู้ใช้งานมองสถานการณ์ทางจริยธรรมจากหลายมุมมอง</li><li>ส่งเสริมการตระหนักถึงผู้มีส่วนได้ส่วนเสียและผลกระทบจากทางเลือกต่าง ๆ</li><li>เปิดโอกาสให้ทบทวนเหตุผลและสมมติฐานที่ใช้ในการตัดสินใจ</li><li>สนับสนุนการเชื่อมโยงทฤษฎีจริยธรรมกับสถานการณ์ที่อาจพบในการทำงาน</li><li>เป็นเครื่องมือประกอบการเรียนรู้และการอภิปรายเกี่ยวกับการตัดสินใจเชิงจริยธรรม</li></ul><div class="note"><strong>Ethical Compass ไม่ได้มุ่งบอกว่าเราควรเลือกอะไร แต่มุ่งช่วยให้เราเข้าใจว่าเหตุใดเราจึงเลือกเช่นนั้น และมีประเด็นใดที่ควรพิจารณาเพิ่มเติม</strong></div><div class="actions"><button class="btn" data-act="home">เริ่มต้นเลือกสถานการณ์ →</button></div></section>`);return}

function stakeholderDecisionLabel(){const yes={silent:'รายงานข้อกังวลต่อ HR',star:'สนับสนุนให้ต้นได้รับการเสนอชื่อรับรางวัล',mistake:'ร้องเรียนพฤติกรรมผู้จัดการ',seat:'ใช้งบช่วยเหลือครอบครัวผู้เสียชีวิต',deadline:'เบิกค่าใช้จ่ายเกินจริงตามแอน'};const no={silent:'ไม่รายงานข้อกังวลต่อ HR',star:'ไม่สนับสนุนให้ต้นได้รับการเสนอชื่อรับรางวัล',mistake:'ไม่ร้องเรียนพฤติกรรมผู้จัดการ',seat:'ไม่ใช้งบขึ้นเงินเดือนช่วยเหลือครอบครัว',deadline:'ไม่เบิกค่าใช้จ่ายเกินจริง'};return (state.initial==='yes'?yes:no)[state.case.id]||(state.initial==='yes'?state.case.action:'ไม่'+state.case.action)}
function stakeholderQuestion(v,kind){const action=stakeholderDecisionLabel();return kind==='good'?'เมื่อคุณตัดสินใจ'+action+' การตัดสินใจนี้จะส่งผลดีต่อ'+v[0]+'มากน้อยเพียงใด?':'เมื่อคุณตัดสินใจ'+action+' การตัดสินใจนี้จะส่งผลเสียหรือสร้างความเสี่ยงต่อ'+v[0]+'มากน้อยเพียงใด?'}

function impactBalance(){let c=state.case,values=c.stake.map((x,i)=>({name:x[0],good:Number(state.stake[i]?.good??0),bad:Number(state.stake[i]?.bad??0)}));let good=values.reduce((a,v)=>a+v.good,0),bad=values.reduce((a,v)=>a+v.bad,0),total=good+bad;let gp=total?Math.round(good/total*100):0,bp=total?100-gp:0;let status=good>bad?'แนวโน้มผลดีสุทธิ':bad>good?'แนวโน้มผลเสียสุทธิ':'ผลดีและผลเสียใกล้เคียงกัน';if(!total)status='ยังไม่มีข้อมูลเพียงพอ';let cls=good>bad?'':bad>good?'negative':'neutral';let alert=values.filter(v=>v.bad===3);let explanation=good>bad?'จากคะแนนที่ให้ ทางเลือกนี้มีแนวโน้มสร้างผลดีสุทธิ แต่ยังต้องดูว่าใครได้รับผลเสีย และจะลดผลกระทบอย่างไร':bad>good?'จากคะแนนที่ให้ ทางเลือกนี้มีแนวโน้มสร้างผลเสียสุทธิ ลองพิจารณาทางเลือกอื่นหรือวิธีลดความเสียหาย':'คะแนนผลดีและผลเสียยังไม่ชี้แนวโน้มชัดเจน ควรดูรายละเอียดรายฝ่ายและข้อมูลที่ยังขาด';if(!total)explanation='ยังไม่มีคะแนนผลกระทบให้เปรียบเทียบ';return `<div class="impact-balance"><div class="balance-head"><span class="balance-label">UTILITARIANISM · IMPACT MAPPER</span><span class="balance-tag ${cls}">${status}</span></div><div class="balance-count">ผลดี ${good} / ผลเสีย ${bad}</div><div class="balance-numbers"><span class="green">ผลดี ${gp}%</span><span class="red">ผลเสีย ${bp}%</span></div><div class="balance-bar" role="img" aria-label="สัดส่วนคะแนนผลดี ${gp} เปอร์เซ็นต์ และผลเสีย ${bp} เปอร์เซ็นต์"><div class="balance-good" style="width:${gp}%"></div><div class="balance-bad" style="width:${bp}%"></div></div><strong>สิ่งที่ผลประเมินบอกเรา</strong><p>${explanation}</p>${alert.length?`<div class="balance-alert"><span>⚠</span><div><strong>ประเด็นที่ต้องคิดต่อ</strong><br>${alert.map(v=>`${esc(v.name)} มีผลเสีย 3/3`).join(' · ')} — ควรตรวจสอบความเสียหายและแนวทางลดผลกระทบเป็นพิเศษ</div></div>`:''}<div class="balance-foot">เปอร์เซ็นต์คือสัดส่วนคะแนนที่ผู้เล่นให้ ไม่ใช่สัดส่วนคนที่ได้ประโยชน์ และยังไม่ได้เปรียบเทียบกับอีกทางเลือกหนึ่ง คะแนนเป็นเพียงตัวช่วยคิด ไม่ใช่คำตัดสินว่าถูกหรือผิด</div></div>`}
function evaluate(id){if(id==='impact'){let values=state.case.stake.map((x,i)=>state.stake[i]||{}),good=values.reduce((s,v)=>s+Number(v.good||0),0),bad=values.reduce((s,v)=>s+Number(v.bad||0),0),serious=values.filter(v=>v.bad===3).length;let color=good>bad?'green':bad>good?'red':'yellow';let reason=good>bad?`แนวโน้มผลดีสุทธิ · ผลดี ${good} / ผลเสีย ${bad}`:bad>good?`แนวโน้มผลเสียสุทธิ · ผลดี ${good} / ผลเสีย ${bad}`:`ผลดี ${good} / ผลเสีย ${bad} · ยังไม่เห็นแนวโน้มชัดเจน`;return {color,reason,guide:`ดูผลกระทบรายฝ่ายประกอบด้วย${serious?' โดยเฉพาะ '+serious+' ฝ่ายที่มีผลเสียระดับ 3':''} คะแนนนี้ยังไม่ใช่การเปรียบเทียบทั้งสองทางเลือก และไม่ใช่คำตัดสินทางจริยธรรม`}}if(id==='duty'){let a=state.duty;let uncertain=Object.values(a).includes('unsure');return {color:'yellow',reason:uncertain?'มีบางเรื่องที่คุณยังไม่แน่ใจ ควรตรวจสอบหน้าที่และสิทธิของผู้เกี่ยวข้องเพิ่มเติม':'คำตอบของคุณสะท้อนมุมมองต่อหน้าที่และความเป็นธรรมที่ต้องชั่งน้ำหนักร่วมกัน',guide:'ตรวจสอบหน้าที่ต่อผู้เกี่ยวข้อง สิทธิ ความลับ และความเป็นธรรม อย่าถือว่าสัญญาณสีเป็นคำวินิจฉัยทางกฎหมาย'}}let a=state.virtue;let no=Object.values(a).filter(v=>v==='no').length,unsure=Object.values(a).includes('unsure');return {color:no>=2?'red':no||unsure?'yellow':'green',reason:no>=2?'หลายคุณธรรมยังไม่สะท้อนในแนวทางนี้':no||unsure?'ยังมีคุณธรรมบางด้านที่ควรทบทวน':'ผู้เล่นเห็นว่าแนวทางสะท้อนคุณธรรมที่พิจารณา',guide:'ทบทวนความกล้าหาญ ความเมตตา ความยุติธรรม และวิจารณญาณ โดยไม่ใช้คะแนนนี้ตัดสินว่าผู้เล่นเป็นคนดีหรือไม่'}}
async function downloadDecisionCard(){

  if(!card){alert('กรุณาเปิดหน้าการ์ดการตัดสินใจก่อนดาวน์โหลด');return}

      check:'ตรวจสอบว่าแนวทางที่ปรับใหม่ช่วยลดผลเสียและรักษาความเป็นธรรมได้จริง'
    }:selectedGuide;
    const decision=modified?'ปรับวิธีดำเนินการ':state.final==='yes'?state.case.yes:state.case.no;
    const change=state.final===state.initial?'ยืนยันคำตอบเดิม':modified?'ปรับวิธีดำเนินการ':'เปลี่ยนคำตอบ';
    const first=state.initial==='yes'?state.case.yes:state.case.no;

    add('rule','');
    add('heading','การตัดสินใจสุดท้าย');
    add('decision',decision);
    add('tag',change);
    add('heading','เหตุผลของฉัน');
    add('body',state.finalWhy?.trim()||'ไม่ได้ระบุเหตุผล');
    add('heading','ก่อนเริ่มวิเคราะห์');
    add('body',first);
    add('small',state.initialWhy?.trim()||'ไม่ได้ระบุเหตุผล');
    add('heading','หลังพิจารณารอบด้าน');
    add('body',decision);
    add('small',change);
    add('heading','สิ่งที่นำไปใช้ได้จริง');
    add('advice','1 · ควรทำอย่างไร',{body:guidance.do,color:'#8fd8b4'});

    if(alerts.length)add('advice','ผู้ที่ควรระวังผลกระทบเป็นพิเศษ',{body:alerts.join(' · '),color:'#f3b3aa'});
    add('heading','สิ่งที่ได้เรียนรู้จาก 3 มุมมอง');
    for(const id of state.selected){
      const lens=lenses.find(x=>x[0]===id);
      add('advice',lens?.[3]||id,{body:lensPlain(id),color:'#f1cf89'});
    }
    add('note','การยืนยันคำตอบเดิมหรือเปลี่ยนใจต่างก็เป็นการเรียนรู้ได้ สิ่งสำคัญคือเหตุผลและการคำนึงถึงผู้เกี่ยวข้อง ไม่ใช่การได้คำตอบที่ระบบกำหนด');
    add('footer','From Instinct to Insight · Ethical Compass');
    function wrap(text,size,bold=false,maxWidth=inner-56){

      const seg=typeof Intl!=='undefined'&&Intl.Segmenter?new Intl.Segmenter('th',{granularity:'word'}):null;
      for(const paragraph of String(text).split('\n')){
        const parts=seg?Array.from(seg.segment(paragraph),x=>x.segment):Array.from(paragraph);
        let line='';
        for(const part of parts){
          if(measure.measureText(line+part).width<=maxWidth){line+=part;continue}
          if(line)lines.push(line.trimEnd());
          line='';
          if(measure.measureText(part).width<=maxWidth){line=part.trimStart();continue}
          for(const ch of Array.from(part)){
            if(measure.measureText(line+ch).width>maxWidth&&line){lines.push(line);line=''}

        }

    }
    let y=104;

        case 'heading':lines=wrap(block.text,31,true);h=lines.length*46+22;break;
        case 'decision':lines=wrap(block.text,37,true);h=lines.length*56+22;break;
        case 'tag':lines=wrap(block.text,25,true);h=lines.length*38+16;break;

    }
    function lineGroup(lines,x,ty,size,lineHeight,color,bold=false){for(let i=0;i<lines.length;i++)text(lines[i],x,ty+i*lineHeight,size,color,bold)}
    for(const item of layout){
      const ty=item.y;
      if(item.kind==='brand')text(item.text,margin+24,ty,30,'#e5c486',true);
      if(item.kind==='title')text(item.text,margin+24,ty,45,'#fff7e9',true);
      if(item.kind==='subtitle')lineGroup(item.lines,margin+24,ty,28,42,'#b7cbd8');
      if(item.kind==='rule'){ctx.strokeStyle='#bb9a63';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(margin+24,ty+7);ctx.lineTo(width-margin-24,ty+7);ctx.stroke()}
      if(item.kind==='heading')lineGroup(item.lines,margin+24,ty,31,46,'#e8c58c',true);
      if(item.kind==='decision')lineGroup(item.lines,margin+24,ty,37,56,'#fff7e9',true);
      if(item.kind==='tag')lineGroup(item.lines,margin+24,ty,25,38,'#9bdcc0',true);
      if(item.kind==='body')lineGroup(item.lines,margin+24,ty,29,46,'#f1f1ed');
      if(item.kind==='small')lineGroup(item.lines,margin+24,ty,25,39,'#b6c7d2');
      if(item.kind==='advice'||item.kind==='note'){
        ctx.fillStyle=item.kind==='note'?'#30475a':'#ffffff0d';
        ctx.beginPath();ctx.roundRect(margin+12,ty+1,inner-24,item.h-12,16);ctx.fill();

  finally{if(button){button.disabled=false;button.textContent=originalLabel}}
}
function exportJourney(){let c=state.case;let text=`ETHICAL COMPASS V5 — DECISION JOURNEY\nCase: ${c.title}\n\nSituation: ${c.story}\nAction: ${c.action}\nFirst Instinct: ${state.initial==='yes'?c.yes:c.no}\nReason: ${state.initialWhy}\n\nConfidential File: ${c.conf||'ไม่มีข้อมูลเพิ่มเติม'}\nAfter File: ${state.post}\n\nLens Results:\n${state.selected.map(id=>`${lenses.find(x=>x[0]===id)[2]}: ${state.results[id].color.toUpperCase()} — ${state.results[id].reason}`).join('\n')}\n\nFinal Decision: ${state.final==='modify'?'MODIFY':state.final==='yes'?c.yes:c.no}\nReason: ${state.finalWhy}\nMost useful lens: ${state.influential}\n\nThis is a reflection exercise, not an ethical verdict.`;let b=new Blob([text],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download='ethical_compass_decision_journey.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),500)}
$('#homeBtn').onclick=()=>{state={page:'home'};render()};document.addEventListener('input',e=>{if(Object.prototype.hasOwnProperty.call(customDraft,e.target.id)){customDraft[e.target.id]=e.target.value;saveDraft()}if(e.target.id==='initialWhy')state.initialWhy=e.target.value;if(e.target.id==='finalWhy')state.finalWhy=e.target.value;if(e.target.id==='dutyWhy')state.dutyWhy=e.target.value;if(e.target.id==='virtueWhy')state.virtueWhy=e.target.value;if(e.target.id==='influential')state.influential=e.target.value});document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;let d=b.dataset;if(d.act==='dismissLensIntro'){state.lensIntroSeen=true;render();return}if(d.case){initCase(CASES.find(c=>c.id===d.case));return}if(d.choice){state.initial=d.choice;render();return}if(d.post){state.post=d.post;render();return}if(d.final){state.final=d.final;render();return}if(d.stake!==undefined){state.stakeIdx=+d.stake;render();return}if(d.score){let [field,n]=d.score.split(':');setScore(field,+n);return}if(d.toggle){state.selected=state.selected.includes(d.toggle)?state.selected.filter(x=>x!==d.toggle):state.selected.length<3?[...state.selected,d.toggle]:state.selected;render();return}if(d.duty){let [i,v]=d.duty.split(':');state.duty??={};state.duty[i]=v;render();return}if(d.virtue){let [i,v]=d.virtue.split(':');state.virtue??={};state.virtue[i]=v;render();return}if(!d.act)return;let act=d.act;if(act==='nextStake'){let i=state.stakeIdx;if(state.stake[i]?.good!==undefined&&state.stake[i]?.bad!==undefined&&i<state.case.stake.length-1){state.stakeIdx=i+1;render()}return}if(act==='addStake'){let el=document.getElementById('extraStakeName');let name=(el?.value||'').trim();let error=document.getElementById('stakeError');if(!name){if(error)error.textContent='กรุณาใส่ชื่อผู้มีส่วนได้ส่วนเสียก่อน';return}if(state.case.stake.some(x=>x[0].trim().toLowerCase()===name.toLowerCase())){if(error)error.textContent='มีฝ่ายนี้อยู่แล้ว ลองเลือกการ์ดด้านบนได้เลย';return}if(state.case.stake.length>=15){if(error)error.textContent='เพิ่มได้สูงสุด 15 ฝ่ายต่อเคส';return}state.case.stake.push([name,`ถ้าคุณเลือกทางนี้ ${name} จะได้ประโยชน์อะไรบ้าง และสำคัญแค่ไหน?`,`ถ้าคุณเลือกทางนี้ ${name} จะเดือดร้อนหรือเสี่ยงอะไรบ้าง และหนักแค่ไหน?`]);state.stakeIdx=state.case.stake.length-1;render();return} if(act==='home'||act==='restart'){state={page:'home'};render()}else if(act==='newCustom'||act==='editCustom'){state.page='customForm';render()}else if(act==='saveCustom'){for(const id of Object.keys(customDraft)){const el=document.getElementById(id);if(el)customDraft[id]=el.value}saveDraft();let title=$('#ct').value.trim(),story=$('#cs').value.trim(),action=$('#ca').value.trim(),stake=$('#ck').value.split('\n').map(s=>s.trim()).filter(Boolean),conf=$('#cc').value.trim();if(!title||!story||!action||stake.length<2||!$('#cr').value.trim()){$('#formError').textContent='กรุณากรอกชื่อเคส สถานการณ์ บทบาทผู้เล่น การกระทำ และผู้เกี่ยวข้องอย่างน้อย 2 กลุ่ม';return}initCase({id:'custom',num:'MY',title,role:$('#cr').value.trim(),subtitle:'My Own Case',brief:'สถานการณ์ที่คุณนำมาเอง',story,action,yes:'DO IT — '+action,no:'DON’T DO IT — ไม่'+action,conf,stake:stake.map(x=>[x,`ถ้าคุณเลือกทำแบบนี้ ${x} จะได้ประโยชน์อะไรบ้าง และสำคัญแค่ไหน?`,`ถ้าคุณเลือกทำแบบนี้ ${x} จะเดือดร้อนหรือเสี่ยงอะไรบ้าง และหนักแค่ไหน?`]),duties:['ถ้าคุณเลือกทำแบบนี้ คุณกำลังทำหน้าที่ที่ควรทำอยู่ไหม?','มีใครอาจถูกเอาเปรียบ เสียสิทธิ หรือเสียความไว้วางใจเพราะทางเลือกนี้ไหม?','มีหน้าที่สองอย่างที่คุณต้องรักษา แต่ทำพร้อมกันได้ยากไหม?'],virtues:['ถ้าคุณเลือกทางนี้ คุณกำลังซื่อสัตย์และรับผิดชอบกับคนที่เกี่ยวข้องไหม?','คุณคิดถึงความรู้สึกและความเป็นธรรมของทุกฝ่ายมากพอหรือยัง?','คุณเลือกเพราะเห็นว่าควรทำจริง ๆ หรือเพราะกลัวผลที่จะตามมา?']})}else if(act==='goConf'){state.page='conf';render()}else if(act==='reveal'){state.confOpened=true;render()}else if(act==='first'||act==='conf'||act==='post'||act==='choose'||act==='summary'){state.page=act;render()}else if(act==='goPost'){state.page='post';render()}else if(act==='goChoose'){state.page='choose';render()}else if(act==='startLenses'){state.page='lens';state.results={};state.stake={};state.stakeIdx=0;state.duty={};state.virtue={};render()}else if(act==='finishImpact'||act==='finishDuty'||act==='finishVirtue'){let id=act==='finishImpact'?'impact':act==='finishDuty'?'duty':'virtue';state.results[id]=evaluate(id);state.page='lens';render()}else if(act==='goCompare'&&state.case.id!=='custom'){state.page='compare';render()}else if(act==='goFinal'){state.page='final';render()}else if(act==='finishFinal'){state.page='done';render()}else if(act==='downloadCard')downloadDecisionCard();else if(act==='export')exportJourney()});render();
