@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=DM+Sans:wght@400;600;700&display=swap');
:root{--bg:#0c1523;--panel:#17263a;--panel2:#1d3046;--ink:#edf2f7;--muted:#a9b8c8;--gold:#e7c58c;--line:#395067;--red:#ef8984;--green:#88d1b1;--yellow:#f1c778}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 90% 0,#203750 0,transparent 45%),var(--bg);color:var(--ink);font-family:'IBM Plex Sans Thai','DM Sans',system-ui,sans-serif;line-height:1.65}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}.shell{max-width:1100px;margin:auto;padding:20px 22px 75px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:8px 0 18px}.brand{display:flex;align-items:center;gap:12px;font-family:'DM Sans',sans-serif;font-weight:700;letter-spacing:2px}.logo{border:1px solid var(--gold);color:var(--gold);width:43px;height:43px;border-radius:50%;display:grid;place-items:center;font-size:27px}.tiny{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);font-family:'DM Sans',sans-serif}.muted{color:var(--muted)}h1{font-family:'DM Sans','IBM Plex Sans Thai',sans-serif;letter-spacing:-1px;line-height:1.12;font-size:clamp(35px,5vw,65px);margin:10px 0 16px}h2{font-size:clamp(23px,3vw,33px);line-height:1.35;margin:6px 0 15px}h3{margin:0 0 10px;font-size:20px}p{margin:8px 0 14px}.hero{padding:54px 0 25px;max-width:850px}.gold{color:var(--gold)}.cases{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.case{border:1px solid var(--line);border-radius:15px;background:linear-gradient(145deg,#22354b,#132235);padding:22px;text-align:left;color:var(--ink);min-height:226px;display:flex;flex-direction:column;transition:.2s}.case:hover,.case:focus-visible{transform:translateY(-3px);border-color:var(--gold);box-shadow:0 14px 35px #0005}.case .symbol{font-size:35px;color:var(--gold);line-height:1.2;margin:16px 0}.case strong{font-family:'DM Sans',sans-serif;letter-spacing:.5px;font-size:19px}.case small{color:var(--muted);line-height:1.6}.custom{background:linear-gradient(140deg,#3d382e,#1c2938);border-color:#857252}.panel{background:linear-gradient(145deg,var(--panel),#142237);border:1px solid var(--line);border-radius:17px;padding:clamp(20px,3vw,34px);margin:18px 0}.paper{background:#f1e8d8;color:#2e3540;padding:clamp(20px,4vw,38px);border-radius:5px 16px 16px 5px;box-shadow:inset 8px 0 #d1c3aa,0 14px 40px #0006;position:relative}.paper:before{content:'CONFIDENTIAL';font:700 12px 'DM Sans';letter-spacing:3px;color:#ad564e;border:2px solid #ad564e;padding:5px 9px;position:absolute;right:18px;top:17px;transform:rotate(8deg)}.paper p{margin-top:30px}.folder{border:2px solid #c5a76e;background:linear-gradient(160deg,#7b6040,#493b2d);border-radius:13px;padding:30px;text-align:center;max-width:530px;margin:24px auto;box-shadow:0 22px 40px #0007;position:relative}.folder:before{content:'';position:absolute;top:-14px;left:18px;width:120px;height:16px;border-radius:8px 8px 0 0;background:#7b6040}.folder .symbol{font-size:60px;color:#f4d9a5}.reveal{animation:unfold .65s ease both;transform-origin:top center}@keyframes unfold{from{opacity:0;transform:rotateX(-45deg) translateY(-15px)}to{opacity:1;transform:rotateX(0) translateY(0)}}.btn{border:1px solid var(--gold);border-radius:9px;background:var(--gold);color:#172335;padding:12px 20px;font-weight:700}.btn.secondary{background:transparent;color:var(--gold)}.btn.ghost{background:#22364b;color:var(--ink);border-color:var(--line)}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}.steps{display:flex;flex-wrap:wrap;gap:8px;margin:25px 0}.step{border:1px solid var(--line);padding:7px 11px;border-radius:25px;color:var(--muted);font-size:12px}.step.active{border-color:var(--gold);color:var(--gold);background:#e7c58c15}.step.done{color:var(--green)}.choicegrid{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin:20px 0}.choice{background:#1b2d43;border:1px solid var(--line);color:var(--ink);padding:18px;text-align:left;border-radius:12px;min-height:85px}.choice.selected{border-color:var(--gold);background:#6d593a55}.choice strong{display:block;font-size:17px}.choice span{font-size:12px;color:var(--muted)}label{display:block;font-weight:600;margin:13px 0 7px}textarea,input,select{background:#0e1c2c;border:1px solid #4b6175;border-radius:8px;color:var(--ink);padding:12px;width:100%;outline:none}textarea:focus,input:focus,select:focus{border-color:var(--gold)}textarea{min-height:86px;resize:vertical}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.pill{display:inline-block;font-size:12px;border:1px solid var(--line);padding:4px 10px;border-radius:30px;color:var(--gold)}.stakegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.stake{border:1px solid var(--line);background:#1d3046;border-radius:12px;padding:17px;color:var(--ink);text-align:left}.stake.active{border-color:var(--gold)}.stake.complete{border-color:var(--green)}.scale{display:flex;gap:8px;margin:9px 0 22px}.scale button{flex:1;min-height:47px;border:1px solid #52677b;border-radius:8px;background:#1b2d43;color:var(--ink)}.scale button.on.good{background:#255d4c;border-color:var(--green)}.scale button.on.bad{background:#653d42;border-color:var(--red)}.section{border-left:3px solid var(--gold);padding-left:15px;margin:20px 0}.line{border-top:1px solid var(--line);margin:22px 0}.impact-balance{border:1px solid var(--line);border-radius:15px;padding:20px;margin:16px 0 22px;background:#102033}.balance-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.balance-label{font-size:12px;color:var(--gold);letter-spacing:1px}.balance-tag{border-radius:18px;padding:4px 11px;font-size:12px;font-weight:700;background:#284e40;color:#a4ebc8}.balance-tag.negative{background:#60343b;color:#ffb6b2}.balance-tag.neutral{background:#62502e;color:#f5d98e}.balance-count{font-size:22px;font-weight:700;margin:14px 0}.balance-numbers{display:flex;justify-content:space-between;font-size:14px;font-weight:700}.balance-bar{display:flex;width:100%;height:14px;border-radius:20px;overflow:hidden;background:#34485a;margin:8px 0 14px}.balance-good{background:#149d83}.balance-bad{background:#dc6d70}.balance-note{font-size:13px;color:var(--muted)}.balance-alert{display:flex;gap:9px;margin-top:13px;padding:12px;border:1px solid #a8804b;border-radius:9px;color:#f1d2a1;font-size:13px}.balance-alert strong{color:#ffe4b7}.balance-foot{font-size:12px;color:var(--muted);margin-top:12px}.result{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.signal{border:1px solid var(--line);border-radius:12px;padding:16px;background:#1d3046}.signal .dot{width:12px;height:12px;border-radius:50%;display:inline-block;margin-right:8px}.green{color:var(--green)}.yellow{color:var(--yellow)}.red{color:var(--red)}.dot.green{background:var(--green)}.dot.yellow{background:var(--yellow)}.dot.red{background:var(--red)}.note{background:#26394c;border-left:3px solid var(--gold);padding:15px;border-radius:4px;margin:18px 0}.warn{color:#f0caa1;font-size:13px}.progress{height:6px;background:#2b4054;border-radius:9px;overflow:hidden;margin:10px 0 22px}.progress>div{height:100%;background:var(--gold);transition:width .3s}.tag{display:inline-block;padding:3px 9px;background:#ffffff0d;border:1px solid var(--line);border-radius:6px;font-size:12px;margin:4px 5px 4px 0}.footer{margin-top:50px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:15px}@media(max-width:750px){.cases{grid-template-columns:1fr 1fr}.result{grid-template-columns:1fr}.shell{padding:14px}.hero{padding-top:32px}}@media(max-width:520px){.cases,.choicegrid,.grid2,.stakegrid{grid-template-columns:1fr}.top .tiny{display:none}.case{min-height:175px}}
.scoreguide{background:#102136;border:1px solid #52677b;border-radius:12px;padding:16px;margin:16px 0}.scoreguide h4{margin:0 0 9px;color:var(--gold);font-size:16px}.scoreguide .levels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.scoreguide .level{background:#21364a;border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.5}.scoreguide .level b{color:var(--gold);font-size:17px;margin-right:5px}.scoreguide .hint{font-size:13px;color:var(--muted);margin:10px 0 0}.scale button{min-height:58px}.scale button .scorelabel{display:block;font-size:11px;font-weight:400;line-height:1.25}@media(max-width:530px){.scoreguide .levels{grid-template-columns:1fr 1fr}.scoreguide .level{padding:8px;font-size:12px}} .guidecols{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.guidecol{padding:12px;border-radius:12px;background:#1b3042;border:1px solid #3e5266}.guidecol h4{font-size:14px}.benefitguide h4{color:#8fe0b6}.harmguide h4{color:#ffb3b3}.guidecol .levels{grid-template-columns:1fr}.guidecol .level{background:#263e52}.benefitguide .level b{color:#8fe0b6}.harmguide .level b{color:#ffb3b3}@media(max-width:700px){.guidecols{grid-template-columns:1fr}}  .current-stake{position:sticky;top:0;z-index:5;padding:15px 18px;margin:0 0 14px;background:#233a4b;border:2px solid #c4a364;border-radius:14px;box-shadow:0 8px 25px #0007} .decision-card{max-width:750px;margin:0 auto;border-radius:26px!important;box-shadow:0 18px 60px #0008,inset 0 0 0 5px #ffffff0b;position:relative;overflow:hidden} .decision-card:before{content:'✦';position:absolute;right:22px;top:14px;font-size:68px;color:#d6b46b22;pointer-events:none} .decision-card .section{border-radius:12px;background:#ffffff08;padding:13px 16px;margin:12px 0} .intro-guide h2{margin:26px 0 10px;color:#e8d09a;font-size:21px}.intro-guide p{line-height:1.85}.intro-guide li{line-height:1.8;margin-bottom:8px}.intro-guide ol,.intro-guide ul{padding-left:25px}</style></head><body><main class="shell"><header class="top"><div class="brand"><div class="logo">✧</div><div>ETHICAL<br>COMPASS</div></div><div class="tiny">THE CASE FILES · V5.7</div><button class="btn ghost" id="homeBtn">⌂ Case Library</button></header><div id="app"></div><footer class="footer">Ethical Compass เป็นเครื่องมือฝึกการพิจารณาทางจริยธรรม ไม่ใช่ระบบตัดสินความถูกผิดหรือคำแนะนำทางกฎหมาย · ข้อมูลอยู่ในเบราว์เซอร์ของผู้เล่นเท่านั้น ไม่มีการส่งข้อมูลขึ้นเซิร์ฟเวอร์</footer></main><script id="case-data" type="application/json">[{"id":"silent","num":"01","title":"THE SILENT APPROVAL","subtitle":"Power & Silence","icon":"◈","brief":"รายงานพฤติกรรมผู้จัดการที่มีอำนาจเหนือคุณ หรือรักษาความลับของผู้ให้ข้อมูล?","story":"คุณเพิ่งย้ายมาดูแลทีมได้ 2 เดือน พบว่าผู้จัดการซึ่งเป็นหัวหน้าของคุณตำหนิและกดดันพนักงานอย่างรุนแรงมานาน หลายคนไม่กล้าร้องเรียนเพราะกลัวถูกตอบโต้ HR ติดต่อคุณเพื่อสอบถามสาเหตุการลาออกสูง พนักงานในทีมชื่อ “เมย์” ซึ่งไว้ใจคุณ เล่าเรื่องพฤติกรรมของผู้จัดการและขอให้คุณอย่าเปิดเผยว่าเธอเป็นผู้ให้ข้อมูล เพราะกลัวถูกระบุตัว ขณะเดียวกันผู้จัดการบอกว่าการสอบสวนอาจทำให้โครงการสำคัญสะดุด และเขามีอิทธิพลต่อการประเมินผลงานของคุณ","action":"รายงานข้อกังวลต่อ HR ในตอนนี้","yes":"REPORT — รายงานตอนนี้","no":"DON’T REPORT — ยังไม่รายงาน","conf":"คุณทราบว่าพนักงานอีกคนหนึ่ง (ไม่ใช่เมย์) เคยแจ้ง HR แล้ว ต่อมาผู้จัดการรู้รายละเอียดบางอย่างและลดบทบาทเขาในโครงการ แม้ยังพิสูจน์ไม่ได้ว่าเป็นการตอบโต้ ขณะเดียวกัน HR แจ้งว่ามีช่องทางรับเรื่องที่จำกัดผู้เข้าถึงข้อมูล แต่ยังไม่อธิบายมาตรการป้องกันการระบุตัวผู้ให้ข้อมูล","stake":[["เมย์ (พนักงานผู้ให้ข้อมูล)","การรายงานอาจช่วยให้ข้อกังวลของเมย์ได้รับการตรวจสอบมากเพียงใด?","การรายงานอาจทำให้เมย์ถูกระบุตัวหรือถูกตอบโต้มากเพียงใด?"],["พนักงานคนอื่น","การรายงานอาจช่วยลดการกดดันและสร้างความปลอดภัยให้ทีมมากเพียงใด?","การตรวจสอบอาจสร้างความตึงเครียดหรือกระทบคนในทีมมากเพียงใด?"],["ตัวคุณ","การรายงานอาจช่วยให้คุณทำหน้าที่หัวหน้างานอย่างรับผิดชอบมากเพียงใด?","การรายงานอาจกระทบความสัมพันธ์กับผู้จัดการและอาชีพของคุณมากเพียงใด?"],["องค์กร","องค์กรอาจได้ประโยชน์จากการจัดการปัญหาและรักษาคนในทีมมากเพียงใด?","องค์กรอาจมีต้นทุนหรือความเสี่ยงจากการจัดการเรื่องนี้มากเพียงใด?"],["ฝ่าย HR","ฝ่าย HR อาจได้รับข้อมูลที่ช่วยดูแลพนักงานและปรับปรุงระบบมากเพียงใด?","ฝ่าย HR อาจต้องรับภาระการตรวจสอบและการคุ้มครองข้อมูลมากเพียงใด?"],["ผู้จัดการที่ถูกรายงาน","การรายงานอาจช่วยให้ผู้จัดการได้รับข้อเสนอแนะและมีโอกาสปรับปรุงพฤติกรรมอย่างเป็นธรรมมากเพียงใด?","การรายงานอาจกระทบชื่อเสียง ความสัมพันธ์ และหน้าที่การงานของผู้จัดการมากเพียงใด โดยเฉพาะหากข้อเท็จจริงยังไม่ชัดเจน?"]],"duties":["ถ้าคุณรายงานตอนนี้ คุณกำลังทำหน้าที่ดูแลพนักงานอยู่ไหม?","การรายงานตอนนี้อาจทำให้คุณผิดความไว้วางใจของผู้ให้ข้อมูลไหม?","คุณคิดว่ามีวิธีรายงานที่ช่วยปกป้องทีมและรักษาความลับของผู้ให้ข้อมูลไปพร้อมกันได้ไหม?"],"virtues":["คุณกล้าปกป้องทีม แม้ตัวเองอาจเดือดร้อนหรือเปล่า?","คุณคิดถึงความกลัวของคนที่มาเล่าเรื่องให้ฟังมากพอไหม?","คุณคิดว่าทางเลือกนี้แสดงทั้งความกล้าหาญและความระมัดระวังต่อคนที่เสี่ยงไหม?"],"role":"คุณคือหัวหน้าทีมที่เพิ่งรับตำแหน่ง และเป็นผู้ตัดสินใจว่าจะรายงานข้อกังวลต่อ HR หรือไม่"},{"id":"star","num":"02","title":"THE STAR PERFORMER","subtitle":"Performance & Fairness","icon":"✦","brief":"สนับสนุนรางวัลให้คนทำผลงานยอดเยี่ยมที่เคยทำร้ายความรู้สึกเพื่อนร่วมงานหรือไม่?","story":"คุณเป็นหัวหน้าทีมร่วมคณะเสนอชื่อรางวัลพนักงานยอดเยี่ยม “ต้น” ทำยอดขายสูงสุดและช่วยรักษาลูกค้ารายสำคัญ แต่เพื่อนร่วมงานหลายคนเล่าว่าเขาเคยดูถูกและกดดันคนอื่น บางคนไม่อยากทำงานร่วมกับเขา ผู้บริหารต้องการให้เสนอชื่อต้นเพื่อส่งสัญญาณว่าบริษัทให้คุณค่ากับผลงาน ขณะที่เกณฑ์รางวัลระบุทั้งผลลัพธ์และการทำงานร่วมกัน แต่ยังไม่มีการตรวจสอบข้อร้องเรียนอย่างเป็นทางการ","action":"สนับสนุนเสนอชื่อต้นรับรางวัลในรอบนี้","yes":"ENDORSE — สนับสนุน","no":"DON’T ENDORSE — ไม่สนับสนุน","conf":"HR เปิดเผยว่าต้นเคยได้รับคำเตือนเรื่องการสื่อสาร และมีหลักฐานว่าเข้าร่วมการโค้ชอย่างต่อเนื่องสองเดือนล่าสุด เพื่อนร่วมงานบางคนเห็นว่าเขาปรับตัวดีขึ้น แต่ผู้ที่เคยได้รับผลกระทบยังไม่เคยได้รับคำขอโทษ ขณะเดียวกันลูกค้าสำคัญส่งจดหมายชมเขาโดยเฉพาะ","stake":[["ต้น","การได้รับรางวัลอาจช่วยส่งเสริมการปรับปรุงตัวและผลงานของต้นมากเพียงใด?","การได้รับรางวัลอาจสร้างแรงกดดันหรือความคาดหวังที่ไม่เหมาะสมต่อต้นมากเพียงใด?"],["เพื่อนร่วมงานที่ได้รับผลกระทบ","การเสนอชื่ออาจช่วยให้พวกเขาได้ร่วมงานกับคนที่ปรับตัวดีขึ้นมากเพียงใด?","การเสนอชื่ออาจทำให้พวกเขารู้สึกว่าพฤติกรรมที่เคยเกิดขึ้นถูกมองข้ามมากเพียงใด?"],["สมาชิกทีมคนอื่น","การยกย่องผลงานอาจกระตุ้นทีมให้พัฒนามากเพียงใด?","การยกย่องอาจบั่นทอนความเชื่อมั่นในเกณฑ์รางวัลมากเพียงใด?"],["ลูกค้า","การตัดสินใจนี้อาจช่วยให้ลูกค้าได้รับบริการที่ดีและต่อเนื่องมากเพียงใด?","การตัดสินใจนี้อาจกระทบคุณภาพบริการหรือความเชื่อมั่นของลูกค้ามากเพียงใด?"],["องค์กร","การตัดสินใจนี้อาจช่วยรักษาผลงานและมาตรฐานองค์กรได้มากเพียงใด?","การตัดสินใจนี้อาจกระทบความน่าเชื่อถือของเกณฑ์รางวัลมากเพียงใด?"]],"duties":["คุณพิจารณาทั้งผลงานและวิธีปฏิบัติต่อเพื่อนร่วมงานแล้วหรือยัง?","ถ้าต้นได้รางวัล คนที่เคยได้รับผลกระทบจะได้รับความเป็นธรรมไหม?","คุณคิดว่าสามารถให้โอกาสต้นปรับตัว โดยไม่มองข้ามผลกระทบที่เคยเกิดขึ้นได้ไหม?"],"virtues":["คุณกำลังให้ความยุติธรรมกับทั้งต้นและคนที่เคยได้รับผลกระทบไหม?","คุณเปิดใจให้ต้นได้พิสูจน์ว่าตัวเองเปลี่ยนไปแล้วหรือเปล่า?","คุณกล้าพูดเรื่องพฤติกรรมของต้น แม้เขาจะทำผลงานได้ดีมากไหม?"],"role":"คุณคือหัวหน้าทีมซึ่งเป็นหนึ่งในคณะผู้เสนอชื่อรางวัล และต้องตัดสินใจว่าจะสนับสนุนการเสนอชื่อต้นหรือไม่"},{"id":"mistake","num":"03","title":"THE HIDDEN MISTAKE","subtitle":"Honesty & Loyalty","icon":"⌁","brief":"แจ้งข้อผิดพลาดของเพื่อนร่วมงาน หรือช่วยแก้เงียบ ๆ เพื่อรักษาความไว้วางใจ?","story":"เพื่อนร่วมทีมที่ช่วยคุณมาตลอดพบว่าตัวเลขในรายงานที่ส่งให้ลูกค้าคลาดเคลื่อน เขาบอกว่าน่าจะแก้ไฟล์ฉบับใหม่และส่งแทนได้ทันก่อนลูกค้าใช้ข้อมูล และขอให้คุณไม่แจ้งหัวหน้าเพราะกำลังถูกพิจารณาเลื่อนตำแหน่ง คุณทราบว่าข้อผิดพลาดอาจกระทบการวางแผนของลูกค้า แต่ยังไม่รู้ว่าลูกค้าได้ใช้ข้อมูลไปหรือยัง หัวหน้าทีมมีกฎให้แจ้งเหตุที่อาจกระทบลูกค้า","action":"แจ้งหัวหน้าและผู้เกี่ยวข้องว่ารายงานมีข้อผิดพลาด","yes":"DISCLOSE — แจ้งข้อผิดพลาด","no":"DON’T DISCLOSE — แก้เงียบ ๆ","conf":"คุณพบอีเมลยืนยันว่าลูกค้าสองรายดาวน์โหลดรายงานไปแล้ว หนึ่งรายกำลังเตรียมใช้ประกอบการตัดสินใจ ขณะเดียวกันเพื่อนร่วมทีมแสดงหลักฐานว่าตัวเลขผิดเพราะข้อมูลต้นทางจากอีกแผนก และเขาเคยแจ้งความเสี่ยงนี้แล้วแต่ไม่มีใครแก้","stake":[["ลูกค้า","การแจ้งข้อผิดพลาดอาจช่วยให้ลูกค้าหยุดใช้ข้อมูลผิดทันเวลาเพียงใด?","การแจ้งอาจทำให้ลูกค้าต้องเสียเวลาและค่าใช้จ่ายในการทบทวนแผนเพียงใด?"],["เพื่อนร่วมทีม","การแจ้งอาจช่วยให้เพื่อนได้รับการแก้ปัญหาที่ต้นเหตุอย่างเป็นธรรมเพียงใด?","การแจ้งอาจกระทบชื่อเสียงหรือโอกาสก้าวหน้าของเพื่อนมากเพียงใด?"],["ตัวคุณ","การตัดสินใจนี้อาจช่วยให้คุณรับผิดชอบและเรียนรู้จากข้อผิดพลาดมากเพียงใด?","การตัดสินใจนี้อาจกระทบความไว้วางใจหรือภาระงานของคุณมากเพียงใด?"],["ทีม","การตัดสินใจนี้อาจช่วยให้ทีมปรับปรุงระบบงานมากเพียงใด?","การตัดสินใจนี้อาจเพิ่มภาระหรือความขัดแย้งในทีมมากเพียงใด?"],["หัวหน้า","การตัดสินใจนี้อาจช่วยให้หัวหน้าจัดการความเสี่ยงได้มากเพียงใด?","การตัดสินใจนี้อาจเพิ่มภาระการแก้ปัญหาของหัวหน้ามากเพียงใด?"],["องค์กร","การตัดสินใจนี้อาจช่วยรักษามาตรฐานความถูกต้องขององค์กรมากเพียงใด?","การตัดสินใจนี้อาจกระทบความเชื่อมั่นหรือค่าใช้จ่ายขององค์กรมากเพียงใด?"]],"duties":["คุณคิดว่าตัวเองมีหน้าที่แจ้งลูกค้าเมื่อรู้ว่าข้อมูลอาจผิดไหม?","ถ้าแจ้งเรื่องนี้แล้วเพื่อนถูกโทษคนเดียว ทั้งที่ปัญหามาจากหลายฝ่าย แบบนั้นยุติธรรมไหม?","คุณคิดว่าสามารถบอกความจริงกับลูกค้า โดยไม่ปล่อยให้เพื่อนถูกโทษเกินจริงได้ไหม?"],"virtues":["คุณกำลังซื่อสัตย์กับคนที่ต้องใช้รายงานนี้ไหม?","คุณเห็นใจเพื่อนโดยไม่ปิดบังปัญหาหรือเปล่า?","คุณกล้ารับมือกับข้อผิดพลาด โดยไม่โยนความผิดให้ใครง่าย ๆ ไหม?"],"role":"คุณคือเพื่อนร่วมทีมที่ทราบว่ารายงานมีข้อผิดพลาด และต้องตัดสินใจว่าจะเปิดเผยข้อผิดพลาดต่อหัวหน้าและผู้เกี่ยวข้องหรือไม่"},{"id":"seat","num":"04","title":"THE LAST SEAT","subtitle":"Opportunity & Fairness","icon":"◇","brief":"ให้โอกาสพัฒนากับคนที่รอมานาน หรือคนที่อาจสร้างผลงานให้ทีมได้เร็วกว่า?","story":"ทีมมีงบอบรมหลักสูตรสำคัญเพียง 1 ที่นั่ง คุณต้องให้ความเห็นประกอบการเลือก “แพร” ทำงานดีและรออบรมมาสองปีเพราะถูกขอให้ช่วยงานเร่งด่วน ส่วน “คิม” เป็นพนักงานศักยภาพสูงที่เพิ่งเข้าทีมและน่าจะนำความรู้มาใช้กับโครงการใหม่ได้ทันที ผู้จัดการเอนเอียงไปทางคิมเพราะต้องการผลลัพธ์เร็ว ทั้งสองคนผ่านเกณฑ์สมัครและไม่มีหลักเกณฑ์จัดลำดับที่ชัดเจน","action":"สนับสนุนให้คิมได้รับที่นั่งอบรมครั้งนี้","yes":"SUPPORT KIM — สนับสนุนคิม","no":"DON’T SUPPORT KIM — ไม่สนับสนุนคิม","conf":"คุณพบว่าแพรเคยได้รับคำยืนยันเป็นลายลักษณ์อักษรว่าจะได้โอกาสอบรมรอบถัดไปหลังช่วยทีมสองครั้ง แต่ไม่มีการติดตามสัญญานั้น ขณะเดียวกันคิมกำลังได้รับข้อเสนอจากบริษัทอื่นและมีโอกาสลาออก หากไม่ได้เห็นเส้นทางเติบโตที่ชัดเจน","stake":[["แพร","การเลือกคิมอาจช่วยให้แพรมีเวลารับผิดชอบงานที่ตนถนัดต่อไปมากเพียงใด?","การเลือกคิมอาจทำให้แพรเสียโอกาสที่เคยได้รับคำมั่นและหมดกำลังใจมากเพียงใด?"],["คิม","การเลือกคิมอาจช่วยพัฒนาศักยภาพและรักษาคิมไว้มากเพียงใด?","การเลือกคิมอาจสร้างแรงกดดันและความขัดแย้งกับเพื่อนร่วมทีมมากเพียงใด?"],["สมาชิกทีม","การเลือกคิมอาจช่วยให้ทีมได้ใช้ทักษะใหม่เร็วขึ้นมากเพียงใด?","การเลือกคิมอาจทำให้ทีมรู้สึกว่าโอกาสพัฒนาไม่เป็นธรรมมากเพียงใด?"],["ผู้จัดการ","การตัดสินใจนี้อาจช่วยให้ผู้จัดการจัดสรรโอกาสพัฒนาได้มากเพียงใด?","การตัดสินใจนี้อาจกระทบความไว้วางใจต่อผู้จัดการมากเพียงใด?"],["องค์กร","การตัดสินใจนี้อาจช่วยให้องค์กรพัฒนาบุคลากรได้มากเพียงใด?","การตัดสินใจนี้อาจกระทบความเป็นธรรมในระบบพัฒนาคนมากเพียงใด?"]],"duties":["คำสัญญาที่องค์กรเคยให้ไว้กับแพรเป็นเรื่องที่คุณควรรักษาไหม?","ถ้าเลือกคิมโดยไม่อธิบายเหตุผลให้ชัดเจน จะยุติธรรมกับแพรไหม?","คุณคิดว่ามีทางรักษาคนเก่งไว้ โดยไม่ผิดคำมั่นกับคนที่รอโอกาสได้ไหม?"],"virtues":["ถ้าเป็นแพรหรือคิม คุณจะรู้สึกว่าการตัดสินใจนี้ยุติธรรมไหม?","คุณคิดถึงอนาคตของทีมและโอกาสของทั้งสองคนครบหรือยัง?","คุณกล้าท้วงผู้จัดการไหม ถ้ารู้สึกว่าเกณฑ์เลือกคนไม่ชัดเจน?"],"role":"คุณคือสมาชิกทีมที่ได้รับมอบหมายให้ให้ความเห็นประกอบการจัดสรรที่นั่งอบรม และต้องตัดสินใจว่าจะสนับสนุนคิมหรือไม่"},{"id":"deadline","num":"05","title":"THE IMPOSSIBLE DEADLINE","subtitle":"Results & Well-being","icon":"⌛","brief":"ยอมให้ทีมทำงานวันหยุดเพื่อรักษาลูกค้า หรือปกป้องเวลาส่วนตัวของสมาชิก?","story":"ผู้จัดการสั่งให้ทีมของคุณทำงานวันหยุดเพื่อส่งโครงการลูกค้ารายใหญ่ให้ทัน หากพลาด ลูกค้าอาจยกเลิกงานและโบนัสทีมอาจลดลง แต่สมาชิกหลายคนมีภาระครอบครัว บางคนทำงานล่วงเวลาติดต่อกันมาหลายสัปดาห์ ผู้จัดการยืนยันว่าเป็นช่วงเวลาสำคัญและขอให้คุณช่วยโน้มน้าวทีม คุณไม่มีอำนาจเปลี่ยนกำหนดส่งเอง","action":"สนับสนุนให้ทีมทำงานวันหยุดตามที่ผู้จัดการขอ","yes":"ACCEPT — สนับสนุน","no":"PUSH BACK — คัดค้าน","conf":"คุณพบว่ากำหนดส่งที่เร่งด่วนเกิดจากผู้จัดการรับปากลูกค้าโดยไม่ปรึกษาทีม ขณะเดียวกันลูกค้าแจ้งว่าอาจยอมรับการส่งงานบางส่วนก่อน หากมีแผนส่งมอบที่น่าเชื่อถือ แต่ยังไม่รับประกันว่าจะรักษาสัญญาทั้งหมด","stake":[["พนักงานในทีม","การทำงานวันหยุดอาจช่วยรักษารายได้และโบนัสของพนักงานมากเพียงใด?","การทำงานวันหยุดอาจกระทบสุขภาพ ความเหนื่อยล้า และเวลาส่วนตัวมากเพียงใด?"],["ครอบครัวพนักงาน","การรักษาโครงการอาจช่วยให้ครอบครัวมีความมั่นคงทางรายได้มากเพียงใด?","การทำงานวันหยุดอาจกระทบภาระดูแลคนในครอบครัวมากเพียงใด?"],["ลูกค้า","การทำงานวันหยุดอาจช่วยให้ลูกค้าได้รับงานทันเวลาเพียงใด?","การเร่งงานอาจทำให้คุณภาพงานและความน่าเชื่อถือเสียหายมากเพียงใด?"],["ตัวคุณ","การตัดสินใจนี้อาจช่วยให้คุณรับผิดชอบโครงการได้มากเพียงใด?","การตัดสินใจนี้อาจเพิ่มภาระหรือความขัดแย้งในการนำทีมของคุณมากเพียงใด?"],["องค์กร","การตัดสินใจนี้อาจช่วยรักษาลูกค้าและรายได้ขององค์กรได้มากเพียงใด?","การตัดสินใจนี้อาจเพิ่มความเสี่ยงด้านบุคลากรและคุณภาพงานมากเพียงใด?"]],"duties":["คุณมีหน้าที่ดูแลสุขภาพและเวลาส่วนตัวของทีมด้วยไหม?","ถ้าคุณปฏิเสธทันทีโดยไม่หาทางส่งงาน ลูกค้าอาจเสียหาย แบบนั้นละเลยความรับผิดชอบไหม?","คุณคิดว่ามีวิธีรักษาคำมั่นกับลูกค้า โดยไม่ผลักภาระทั้งหมดให้ทีมไหม?"],"virtues":["คุณกำลังรับผิดชอบทั้งงานและคนในทีมไหม?","คุณกล้าบอกผู้จัดการไหมว่าทีมอาจรับไม่ไหว?","คุณพยายามหาทางออกที่ไม่ต้องให้ฝ่ายใดฝ่ายหนึ่งแบกรับทั้งหมดหรือยัง?"],"role":"คุณคือหัวหน้าทีมที่ได้รับคำสั่งจากผู้จัดการให้ทีมทำงานวันหยุด และต้องตัดสินใจว่าจะสนับสนุนคำขอนี้หรือไม่"}]</script><script>

function header(title,kicker='CASE FILE',sub=''){return `<section class="hero"><div class="tiny">${esc(kicker)}</div><h1>${esc(title)}</h1>${sub?`<p class="muted">${esc(sub)}</p>`:''}</section>`}

function practicalGuidance(){const base=PRACTICAL_GUIDANCE[state.case.id];const selected=state.initial==='yes'?'yes':'no';const g=base?.[selected]||{do:'หารือกับผู้เกี่ยวข้องและระบุขั้นตอนที่จะทำอย่างชัดเจน',avoid:'อย่าตัดสินจากข้อมูลฝ่ายเดียวหรือมองข้ามผู้ที่อาจเสียหาย',check:'ตรวจสอบข้อเท็จจริง สิทธิ หน้าที่ และผลกระทบก่อนลงมือ'};let alerts=state.selected.includes('impact')?state.case.stake.filter((x,i)=>state.stake[i]?.bad>=2).map(x=>x[0]):[];return {g,alerts}}
function guidanceCard(){let {g,alerts}=practicalGuidance();return `<section class="panel" style="background:#152c3d;border-color:#67869b"><h3>แนวทางคิดต่อก่อนตัดสินใจ</h3><p class="muted">คำแนะนำนี้อ้างอิงทางเลือกแรกของคุณ: <strong>${esc(choiceContext())}</strong> ไม่ใช่คำตัดสินว่าถูกหรือผิด</p><div class="section"><strong class="green">✓ สิ่งที่ทำได้</strong><p>${esc(g.do)}</p></div><div class="section"><strong class="red">! สิ่งที่ควรหลีกเลี่ยง</strong><p>${esc(g.avoid)}</p></div><div class="section"><strong class="gold">? สิ่งที่ควรตรวจสอบก่อนลงมือ</strong><p>${esc(g.check)}</p></div>${alerts.length?`<p class="warn">จากคะแนนของคุณ ควรระวังผลเสียต่อ: ${esc(alerts.join(' · '))}</p>`:''}<p class="muted" style="font-size:12px">คุณสามารถยืนยัน เปลี่ยน หรือปรับวิธีดำเนินการในขั้นตอนถัดไปได้</p></section>`}
function signalLabel(v){return v.color==='green'?'มีประเด็นสนับสนุน':v.color==='red'?'มีข้อกังวลที่ควรระวัง':'มีเรื่องต้องพิจารณาเพิ่ม'}
function lensPlain(id){if(id==='impact'){let values=state.case.stake.map((x,i)=>({name:x[0],good:state.stake[i]?.good??0,bad:state.stake[i]?.bad??0}));let harms=values.filter(x=>x.bad>=2);return harms.length?'มีผู้เกี่ยวข้องที่อาจได้รับผลเสียชัดเจน: '+harms.map(x=>x.name).join(' · ')+' ควรคิดวิธีลดผลกระทบ':'จากคะแนนที่ให้ ยังไม่พบผลเสียระดับสูง แต่ควรตรวจสอบข้อมูลที่อาจตกหล่น'}if(id==='duty'){let a=Object.values(state.duty||{});return a.includes('no')||a.includes('unsure')?'ยังมีเรื่องสิทธิ หน้าที่ หรือความเป็นธรรมที่ควรตรวจสอบก่อนลงมือ':'คุณเห็นว่าแนวทางนี้คำนึงถึงหน้าที่และความเป็นธรรมในหลายด้าน'}let a=Object.values(state.virtue||{});return a.includes('no')||a.includes('unsure')?'ลองทบทวนว่าทางเลือกนี้สะท้อนความกล้าหาญ ความเห็นใจ และความยุติธรรมครบหรือยัง':'คุณมองว่าแนวทางนี้สะท้อนคุณธรรมที่พิจารณาในหลายด้าน'}
function roleBanner(){return state.case?`<div class="note" style="border-left:4px solid var(--gold);margin-bottom:18px"><strong>บทบาทของคุณในสถานการณ์นี้</strong><p style="margin:8px 0 0">${esc(state.case.role||'คุณคือผู้ที่ต้องตัดสินใจเกี่ยวกับการกระทำที่ระบุในโจทย์')}</p></div>`:''}
function render(){let c=state.case;if(state.page==='intro'){html(header('รู้จัก Ethical Compass','FROM INSTINCT TO INSIGHT','จากการตัดสินใจด้วยสัญชาตญาณ สู่การพิจารณาอย่างรอบด้าน')+`<section class="panel intro-guide"><h2>Ethical Compass คืออะไร?</h2><p>Ethical Compass เป็นเครื่องมือสนับสนุนการคิดและการตัดสินใจเชิงจริยธรรม ผ่านสถานการณ์จำลองที่ผู้ใช้งานต้องเผชิญกับทางเลือกซึ่งมีความขัดแย้งระหว่างคุณค่า ผลประโยชน์ และความรับผิดชอบต่อผู้มีส่วนเกี่ยวข้อง</p><p>เครื่องมือนี้ไม่ได้มีหน้าที่ตัดสินว่าทางเลือกใดถูกหรือผิด แต่ถูกออกแบบมาเพื่อช่วยให้ผู้ใช้งานได้ทบทวนเหตุผลของตนเอง และพิจารณาสถานการณ์จากมุมมองที่หลากหลายก่อนตัดสินใจ</p><h2>วัตถุประสงค์ของการพัฒนา</h2><ol><li>เพื่อส่งเสริมกระบวนการคิดและการตัดสินใจเชิงจริยธรรมอย่างเป็นระบบ</li><li>เพื่อเปิดโอกาสให้ผู้ใช้งานได้ทบทวนการตัดสินใจเมื่อได้รับข้อมูลหรือมุมมองเพิ่มเติม</li><li>เพื่อสนับสนุนการประยุกต์ใช้ทฤษฎีจริยธรรม 3 แนวคิด ได้แก่ Utilitarianism, Deontology และ Virtue Ethics ในการวิเคราะห์สถานการณ์</li><li>เพื่อสะท้อนให้เห็นพัฒนาการของเหตุผลและมุมมองในการตัดสินใจ ตั้งแต่ก่อนจนถึงหลังการใช้เครื่องมือ</li></ol><h2>Ethical Compass ทำงานอย่างไร?</h2><p>ผู้ใช้งานจะเริ่มจากการอ่านสถานการณ์และตัดสินใจตามมุมมองของตนเอง จากนั้นจะได้รับข้อมูลเพิ่มเติมที่อาจทำให้ต้องทบทวนการตัดสินใจ ก่อนนำทฤษฎีจริยธรรมทั้ง 3 แนวคิดมาใช้พิจารณาสถานการณ์ ได้แก่</p><ul><li><strong>Utilitarianism:</strong> พิจารณาประโยชน์และผลกระทบที่อาจเกิดขึ้นต่อผู้เกี่ยวข้อง</li><li><strong>Deontology:</strong> พิจารณาหน้าที่ หลักการ สิทธิ และความรับผิดชอบ</li><li><strong>Virtue Ethics:</strong> พิจารณาคุณธรรมและลักษณะของการกระทำที่สะท้อนความเป็นคนดี</li></ul><p>เมื่อสิ้นสุดกระบวนการ ผู้ใช้งานจะได้ทบทวนการตัดสินใจอีกครั้ง และเปรียบเทียบเหตุผลของตนเองก่อนและหลังการใช้เครื่องมือ</p><h2>ประโยชน์ที่คาดว่าจะได้รับ</h2><ul><li>ช่วยกระตุ้นให้ผู้ใช้งานมองสถานการณ์ทางจริยธรรมจากหลายมุมมอง</li><li>ส่งเสริมการตระหนักถึงผู้มีส่วนได้ส่วนเสียและผลกระทบจากทางเลือกต่าง ๆ</li><li>เปิดโอกาสให้ทบทวนเหตุผลและสมมติฐานที่ใช้ในการตัดสินใจ</li><li>สนับสนุนการเชื่อมโยงทฤษฎีจริยธรรมกับสถานการณ์ที่อาจพบในการทำงาน</li><li>เป็นเครื่องมือประกอบการเรียนรู้และการอภิปรายเกี่ยวกับการตัดสินใจเชิงจริยธรรม</li></ul><div class="note"><strong>Ethical Compass ไม่ได้มุ่งบอกว่าเราควรเลือกอะไร แต่มุ่งช่วยให้เราเข้าใจว่าเหตุใดเราจึงเลือกเช่นนั้น และมีประเด็นใดที่ควรพิจารณาเพิ่มเติม</strong></div><div class="actions"><button class="btn" data-act="home">เริ่มต้นเลือกสถานการณ์ →</button></div></section>`);return}
if(state.page==='home'){html(header('Every decision has a consequence.','WELCOME · SELECT YOUR CASE','เลือกแฟ้มสถานการณ์ หรือสร้างเคสของคุณเอง ทุกเคสใช้กระบวนการคิดเดียวกัน')+`<div class="cases">${CASES.map(x=>`<button class="case" data-case="${x.id}"><span class="tiny">FILE ${x.num} / ${esc(x.subtitle)}</span><div class="symbol">${x.icon}</div><strong>${esc(x.title)}</strong><small>${esc(x.brief)}</small></button>`).join('')}<button class="case custom" data-act="newCustom"><span class="tiny">YOUR OWN CASE / OPEN FILE</span><div class="symbol">＋</div><strong>CREATE YOUR CASE</strong><small>นำสถานการณ์จริงของคุณมาลองคิดด้วย Ethical Compass</small></button></div><div class="note">ผู้เล่นแต่ละกลุ่มเลือกเคสต่างกันได้ในอุปกรณ์ของตัวเอง โดยไม่มีการเชื่อมผลระหว่างกลุ่ม</div>`);return}
if(state.page==='customForm'){html(header('Create your own case','YOUR OWN CASE','เขียนสถานการณ์ที่คุณกำลังลังเล โดยไม่ใส่ชื่อจริงหรือข้อมูลอ่อนไหว')+`<section class="panel"><label>ชื่อเคส</label><input id="ct" placeholder="เช่น The Difficult Conversation" maxlength="90"><label>เกิดอะไรขึ้น? ใครมีส่วนเกี่ยวข้อง?</label><textarea id="cs" placeholder="อธิบายข้อเท็จจริงและเหตุผลที่ตัดสินใจยาก"></textarea><label>ผู้เล่นต้องตัดสินใจในฐานะใคร?</label><input id="cr" placeholder="เช่น คุณคือหัวหน้าทีมที่ต้องตัดสินใจเรื่องนี้" maxlength="200"><label>การกระทำที่กำลังพิจารณา (ระบุให้ชัดหนึ่งการกระทำ)</label><input id="ca" placeholder="เช่น แจ้งหัวหน้าว่ามีข้อผิดพลาดในทีม"><label>ผู้มีส่วนได้ส่วนเสีย (หนึ่งคน/กลุ่มต่อหนึ่งบรรทัด อย่างน้อย 2 กลุ่ม)</label><textarea id="ck" placeholder="พนักงานที่ได้รับผลกระทบ&#10;เพื่อนร่วมทีม&#10;ตัวฉัน&#10;ลูกค้า"></textarea><label>ข้อมูลเพิ่มเติมที่ทราบภายหลัง (ถ้ามี)</label><textarea id="cc" placeholder="หากยังไม่มี ให้เว้นว่างไว้ได้"></textarea><p class="note">✓ บันทึกร่างอัตโนมัติในเบราว์เซอร์นี้ · กลับมาแก้ไขได้โดยไม่ต้องพิมพ์ใหม่ (ยกเว้นล้างข้อมูลเว็บไซต์หรือใช้โหมดไม่ระบุตัวตน)</p><p class="warn">เคสส่วนตัวใช้คำถามปลายเปิดและการประเมินตนเอง ไม่สามารถสร้างข้อเท็จจริงหรือคำตัดสินทางจริยธรรมให้อัตโนมัติ</p><div class="actions"><button class="btn ghost" data-act="home">← กลับ</button><button class="btn" data-act="saveCustom">เริ่มวิเคราะห์เคส →</button></div><p id="formError" class="red"></p></section>`);loadDraft();return}
if(state.page==='first'){html(steps()+header(c.title,'FILE '+c.num+' · '+c.subtitle,c.brief)+`<div class="panel"><span class="pill">CASE BRIEF</span>${roleBanner()}<p>${esc(c.story)}</p><div class="line"></div><h3>คุณจะเลือกอย่างไร?</h3><p class="muted">การกระทำที่กำลังพิจารณา: <strong>${esc(c.action)}</strong></p><div class="choicegrid">${[['yes',c.yes],['no',c.no]].map(([v,t])=>`<button class="choice ${state.initial===v?'selected':''}" data-choice="${v}"><strong>${esc(t)}</strong><span>${v==='yes'?'เลือกดำเนินการ':'เลือกไม่ดำเนินการ'}</span></button>`).join('')}</div><label>เหตุผลในการตัดสินใจครั้งแรก</label><textarea id="initialWhy" placeholder="อะไรคือเหตุผลสำคัญที่สุดของคุณ?">${esc(state.initialWhy)}</textarea>${state.custom?'<div class="note">ต้องการแก้ไขรายละเอียดเคส? กลับไปแก้ได้โดยข้อความเดิมไม่หาย</div><button class="btn ghost" data-act="editCustom">✎ แก้ไขเคสของฉัน</button>':''}${actions('home','goConf','ล็อกคำตอบและเปิดแฟ้ม →',!state.initial)}</div>`);return}
if(state.page==='conf'){html(steps()+header('CONFIDENTIAL FILE','EVIDENCE UPDATE','ข้อมูลใหม่อาจเปลี่ยนน้ำหนักของการตัดสินใจ')+`<div class="panel">${initialReminder()}${!state.confOpened?`<div class="folder"><div class="symbol">▣</div><div class="tiny" style="color:#f4d9a5">SEALED DOCUMENT · FILE ${esc(c.num)}</div><h2>CLASSIFIED</h2><p>มีข้อมูลเพิ่มเติมรอให้คุณตรวจสอบ</p><button class="btn" data-act="reveal">✦ เปิดแฟ้มลับ</button></div>`:`<article class="paper reveal"><div class="tiny" style="color:#82613e">EVIDENCE / ${esc(c.num)}</div><h2>NEW INFORMATION</h2><p>${esc(c.conf||'ยังไม่มีข้อมูลเพิ่มเติมที่ได้รับการยืนยัน คุณอาจต้องระบุสิ่งที่ยังไม่ทราบก่อนตัดสินใจ')}</p></article>${actions('first','goPost','ทบทวนหลังเปิดแฟ้ม →')}`}</div>`);return}
if(state.page==='post'){html(steps()+header('Has anything changed?','CHECKPOINT 02','ข้อมูลใหม่ส่งผลต่อมุมมองของคุณหรือไม่')+`<section class="panel">${initialReminder()}<div class="choicegrid">${[['same','ยังยืนยันคำตอบเดิม'],['unsure','เริ่มลังเล / ต้องการข้อมูลเพิ่ม'],['switch','เปลี่ยนใจไปอีกทาง']].map(([v,t])=>`<button class="choice ${state.post===v?'selected':''}" data-post="${v}"><strong>${t}</strong></button>`).join('')}</div>${actions('conf','goChoose','เข้าสู่ Ethical Lens →',!state.post)}</section>`);return}

function stakeholderQuestion(v,kind){if(state.initial!=='no')return v[kind==='good'?1:2];let action=state.case.action;return kind==='good'?'ถ้าคุณเลือกไม่ดำเนินการตามนี้ ('+action+') '+v[0]+' อาจได้รับประโยชน์อะไร และมากเพียงใด?':'ถ้าคุณเลือกไม่ดำเนินการตามนี้ ('+action+') '+v[0]+' อาจได้รับผลเสียหรือความเสี่ยงอะไร และมากเพียงใด?'}
function setScore(field,v){state.stake[state.stakeIdx]??={};state.stake[state.stakeIdx][field]=v;render()}
function impactBalance(){let c=state.case,values=c.stake.map((x,i)=>({name:x[0],good:Number(state.stake[i]?.good??0),bad:Number(state.stake[i]?.bad??0)}));let good=values.reduce((a,v)=>a+v.good,0),bad=values.reduce((a,v)=>a+v.bad,0),total=good+bad;let gp=total?Math.round(good/total*100):0,bp=total?100-gp:0;let status=good>bad?'แนวโน้มผลดีสุทธิ':bad>good?'แนวโน้มผลเสียสุทธิ':'ผลดีและผลเสียใกล้เคียงกัน';if(!total)status='ยังไม่มีข้อมูลเพียงพอ';let cls=good>bad?'':bad>good?'negative':'neutral';let alert=values.filter(v=>v.bad===3);let explanation=good>bad?'จากคะแนนที่ให้ ทางเลือกนี้มีแนวโน้มสร้างผลดีสุทธิ แต่ยังต้องดูว่าใครได้รับผลเสีย และจะลดผลกระทบอย่างไร':bad>good?'จากคะแนนที่ให้ ทางเลือกนี้มีแนวโน้มสร้างผลเสียสุทธิ ลองพิจารณาทางเลือกอื่นหรือวิธีลดความเสียหาย':'คะแนนผลดีและผลเสียยังไม่ชี้แนวโน้มชัดเจน ควรดูรายละเอียดรายฝ่ายและข้อมูลที่ยังขาด';if(!total)explanation='ยังไม่มีคะแนนผลกระทบให้เปรียบเทียบ';return `<div class="impact-balance"><div class="balance-head"><span class="balance-label">UTILITARIANISM · IMPACT MAPPER</span><span class="balance-tag ${cls}">${status}</span></div><div class="balance-count">ผลดี ${good} / ผลเสีย ${bad}</div><div class="balance-numbers"><span class="green">ผลดี ${gp}%</span><span class="red">ผลเสีย ${bp}%</span></div><div class="balance-bar" role="img" aria-label="สัดส่วนคะแนนผลดี ${gp} เปอร์เซ็นต์ และผลเสีย ${bp} เปอร์เซ็นต์"><div class="balance-good" style="width:${gp}%"></div><div class="balance-bad" style="width:${bp}%"></div></div><strong>สิ่งที่ผลประเมินบอกเรา</strong><p>${explanation}</p>${alert.length?`<div class="balance-alert"><span>⚠</span><div><strong>ประเด็นที่ต้องคิดต่อ</strong><br>${alert.map(v=>`${esc(v.name)} มีผลเสีย 3/3`).join(' · ')} — ควรตรวจสอบความเสียหายและแนวทางลดผลกระทบเป็นพิเศษ</div></div>`:''}<div class="balance-foot">เปอร์เซ็นต์คือสัดส่วนคะแนนที่ผู้เล่นให้ ไม่ใช่สัดส่วนคนที่ได้ประโยชน์ และยังไม่ได้เปรียบเทียบกับอีกทางเลือกหนึ่ง คะแนนเป็นเพียงตัวช่วยคิด ไม่ใช่คำตัดสินว่าถูกหรือผิด</div></div>`}
function evaluate(id){if(id==='impact'){let values=state.case.stake.map((x,i)=>state.stake[i]||{}),good=values.reduce((s,v)=>s+Number(v.good||0),0),bad=values.reduce((s,v)=>s+Number(v.bad||0),0),serious=values.filter(v=>v.bad===3).length;let color=good>bad?'green':bad>good?'red':'yellow';let reason=good>bad?`แนวโน้มผลดีสุทธิ · ผลดี ${good} / ผลเสีย ${bad}`:bad>good?`แนวโน้มผลเสียสุทธิ · ผลดี ${good} / ผลเสีย ${bad}`:`ผลดี ${good} / ผลเสีย ${bad} · ยังไม่เห็นแนวโน้มชัดเจน`;return {color,reason,guide:`ดูผลกระทบรายฝ่ายประกอบด้วย${serious?' โดยเฉพาะ '+serious+' ฝ่ายที่มีผลเสียระดับ 3':''} คะแนนนี้ยังไม่ใช่การเปรียบเทียบทั้งสองทางเลือก และไม่ใช่คำตัดสินทางจริยธรรม`}}if(id==='duty'){let a=state.duty;let uncertain=Object.values(a).includes('unsure');return {color:'yellow',reason:uncertain?'มีบางเรื่องที่คุณยังไม่แน่ใจ ควรตรวจสอบหน้าที่และสิทธิของผู้เกี่ยวข้องเพิ่มเติม':'คำตอบของคุณสะท้อนมุมมองต่อหน้าที่และความเป็นธรรมที่ต้องชั่งน้ำหนักร่วมกัน',guide:'ตรวจสอบหน้าที่ต่อผู้เกี่ยวข้อง สิทธิ ความลับ และความเป็นธรรม อย่าถือว่าสัญญาณสีเป็นคำวินิจฉัยทางกฎหมาย'}}let a=state.virtue;let no=Object.values(a).filter(v=>v==='no').length,unsure=Object.values(a).includes('unsure');return {color:no>=2?'red':no||unsure?'yellow':'green',reason:no>=2?'หลายคุณธรรมยังไม่สะท้อนในแนวทางนี้':no||unsure?'ยังมีคุณธรรมบางด้านที่ควรทบทวน':'ผู้เล่นเห็นว่าแนวทางสะท้อนคุณธรรมที่พิจารณา',guide:'ทบทวนความกล้าหาญ ความเมตตา ความยุติธรรม และวิจารณญาณ โดยไม่ใช้คะแนนนี้ตัดสินว่าผู้เล่นเป็นคนดีหรือไม่'}}
function exportJourney(){let c=state.case;let text=`ETHICAL COMPASS V5 — DECISION JOURNEY\nCase: ${c.title}\n\nSituation: ${c.story}\nAction: ${c.action}\nFirst Instinct: ${state.initial==='yes'?c.yes:c.no}\nReason: ${state.initialWhy}\n\nConfidential File: ${c.conf||'ไม่มีข้อมูลเพิ่มเติม'}\nAfter File: ${state.post}\n\nLens Results:\n${state.selected.map(id=>`${lenses.find(x=>x[0]===id)[2]}: ${state.results[id].color.toUpperCase()} — ${state.results[id].reason}`).join('\n')}\n\nFinal Decision: ${state.final==='modify'?'MODIFY':state.final==='yes'?c.yes:c.no}\nReason: ${state.finalWhy}\nMost useful lens: ${state.influential}\n\nThis is a reflection exercise, not an ethical verdict.`;let b=new Blob([text],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download='ethical_compass_decision_journey.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),500)}
$('#homeBtn').onclick=()=>{state={page:'home'};render()};document.addEventListener('input',e=>{if(Object.prototype.hasOwnProperty.call(customDraft,e.target.id)){customDraft[e.target.id]=e.target.value;saveDraft()}if(e.target.id==='initialWhy')state.initialWhy=e.target.value;if(e.target.id==='finalWhy')state.finalWhy=e.target.value;if(e.target.id==='dutyWhy')state.dutyWhy=e.target.value;if(e.target.id==='virtueWhy')state.virtueWhy=e.target.value;if(e.target.id==='influential')state.influential=e.target.value});document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;let d=b.dataset;if(d.case){initCase(CASES.find(c=>c.id===d.case));return}if(d.choice){state.initial=d.choice;render();return}if(d.post){state.post=d.post;render();return}if(d.final){state.final=d.final;render();return}if(d.stake!==undefined){state.stakeIdx=+d.stake;render();return}if(d.score){let [field,n]=d.score.split(':');setScore(field,+n);return}if(d.toggle){state.selected=state.selected.includes(d.toggle)?state.selected.filter(x=>x!==d.toggle):state.selected.length<3?[...state.selected,d.toggle]:state.selected;render();return}if(d.duty){let [i,v]=d.duty.split(':');state.duty??={};state.duty[i]=v;render();return}if(d.virtue){let [i,v]=d.virtue.split(':');state.virtue??={};state.virtue[i]=v;render();return}if(!d.act)return;let act=d.act;if(act==='nextStake'){let i=state.stakeIdx;if(state.stake[i]?.good!==undefined&&state.stake[i]?.bad!==undefined&&i<state.case.stake.length-1){state.stakeIdx=i+1;render()}return}if(act==='addStake'){let el=document.getElementById('extraStakeName');let name=(el?.value||'').trim();let error=document.getElementById('stakeError');if(!name){if(error)error.textContent='กรุณาใส่ชื่อผู้มีส่วนได้ส่วนเสียก่อน';return}if(state.case.stake.some(x=>x[0].trim().toLowerCase()===name.toLowerCase())){if(error)error.textContent='มีฝ่ายนี้อยู่แล้ว ลองเลือกการ์ดด้านบนได้เลย';return}if(state.case.stake.length>=15){if(error)error.textContent='เพิ่มได้สูงสุด 15 ฝ่ายต่อเคส';return}state.case.stake.push([name,`ถ้าคุณเลือกทางนี้ ${name} จะได้ประโยชน์อะไรบ้าง และสำคัญแค่ไหน?`,`ถ้าคุณเลือกทางนี้ ${name} จะเดือดร้อนหรือเสี่ยงอะไรบ้าง และหนักแค่ไหน?`]);state.stakeIdx=state.case.stake.length-1;render();return} if(act==='home'||act==='restart'){state={page:'home'};render()}else if(act==='newCustom'||act==='editCustom'){state.page='customForm';render()}else if(act==='saveCustom'){for(const id of Object.keys(customDraft)){const el=document.getElementById(id);if(el)customDraft[id]=el.value}saveDraft();let title=$('#ct').value.trim(),story=$('#cs').value.trim(),action=$('#ca').value.trim(),stake=$('#ck').value.split('\n').map(s=>s.trim()).filter(Boolean),conf=$('#cc').value.trim();if(!title||!story||!action||stake.length<2||!$('#cr').value.trim()){$('#formError').textContent='กรุณากรอกชื่อเคส สถานการณ์ บทบาทผู้เล่น การกระทำ และผู้เกี่ยวข้องอย่างน้อย 2 กลุ่ม';return}initCase({id:'custom',num:'MY',title,role:$('#cr').value.trim(),subtitle:'My Own Case',brief:'สถานการณ์ที่คุณนำมาเอง',story,action,yes:'DO IT — '+action,no:'DON’T DO IT — ไม่'+action,conf,stake:stake.map(x=>[x,`ถ้าคุณเลือกทำแบบนี้ ${x} จะได้ประโยชน์อะไรบ้าง และสำคัญแค่ไหน?`,`ถ้าคุณเลือกทำแบบนี้ ${x} จะเดือดร้อนหรือเสี่ยงอะไรบ้าง และหนักแค่ไหน?`]),duties:['ถ้าคุณเลือกทำแบบนี้ คุณกำลังทำหน้าที่ที่ควรทำอยู่ไหม?','มีใครอาจถูกเอาเปรียบ เสียสิทธิ หรือเสียความไว้วางใจเพราะทางเลือกนี้ไหม?','มีหน้าที่สองอย่างที่คุณต้องรักษา แต่ทำพร้อมกันได้ยากไหม?'],virtues:['ถ้าคุณเลือกทางนี้ คุณกำลังซื่อสัตย์และรับผิดชอบกับคนที่เกี่ยวข้องไหม?','คุณคิดถึงความรู้สึกและความเป็นธรรมของทุกฝ่ายมากพอหรือยัง?','คุณเลือกเพราะเห็นว่าควรทำจริง ๆ หรือเพราะกลัวผลที่จะตามมา?']})}else if(act==='goConf'){state.page='conf';render()}else if(act==='reveal'){state.confOpened=true;render()}else if(act==='first'||act==='conf'||act==='post'||act==='choose'||act==='summary'){state.page=act;render()}else if(act==='goPost'){state.page='post';render()}else if(act==='goChoose'){state.page='choose';render()}else if(act==='startLenses'){state.page='lens';state.results={};state.stake={};state.stakeIdx=0;state.duty={};state.virtue={};render()}else if(act==='finishImpact'||act==='finishDuty'||act==='finishVirtue'){let id=act==='finishImpact'?'impact':act==='finishDuty'?'duty':'virtue';state.results[id]=evaluate(id);state.page='lens';render()}else if(act==='goFinal'){state.page='final';render()}else if(act==='finishFinal'){state.page='done';render()}else if(act==='export')exportJourney()});render();
</script></body></html>
